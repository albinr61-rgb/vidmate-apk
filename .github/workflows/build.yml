name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Create App & Inject Deep Recursive Engine
        run: |
          flutter create my_downloader --org com.myvidmate.app
          cd my_downloader
          
          flutter pub add webview_flutter youtube_explode_dart dio path_provider shared_preferences

          cat << 'EOF' > lib/main.dart
          import 'dart:convert';
          import 'dart:io';
          import 'package:flutter/material.dart';
          import 'package:webview_flutter/webview_flutter.dart';
          import 'package:youtube_explode_dart/youtube_explode_dart.dart';
          import 'package:path_provider/path_provider.dart';
          import 'package:dio/dio.dart';
          import 'package:shared_preferences/shared_preferences.dart';

          void main() {
            runApp(const MaterialApp(
              debugShowCheckedModeBanner: false,
              home: MainMasterApp(),
            ));
          }

          class DownloadTask {
            final String id;
            final String name;
            final String subfolder;
            double progress;
            String status;
            CancelToken? cancelToken;

            DownloadTask({
              required this.id,
              required this.name,
              required this.subfolder,
              this.progress = 0.0,
              this.status = 'downloading',
              this.cancelToken,
            });
          }

          class MainMasterApp extends StatefulWidget {
            const MainMasterApp({super.key});

            @override
            State<MainMasterApp> createState() => _MainMasterAppState();
          }

          class _MainMasterAppState extends State<MainMasterApp> with SingleTickerProviderStateMixin {
            int _currentTab = 0;
            late TabController _downloadTabController;
            late final WebViewController _webController;
            final TextEditingController _searchController = TextEditingController();
            bool _isLoading = false;
            bool _isBottomSheetOpen = false;

            bool _isDesktopMode = false;
            static const String desktopUA = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36";
            static const String mobileUA = "Mozilla/5.0 (Linux; Android 13; Mobile) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Mobile Safari/537.36";

            List<DownloadTask> _activeTasks = [];
            List<Map<String, String>> _bookmarks = [];
            Map<String, bool> _downloadedQualities = {};
            List<FileSystemEntity> _downloadedFiles = [];

            Dio _getSafeDio(String refererUrl) {
              return Dio(BaseOptions(
                headers: {
                  'User-Agent': _isDesktopMode ? desktopUA : mobileUA,
                  'Accept': 'text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8',
                  'Referer': refererUrl,
                },
                followRedirects: true,
                validateStatus: (status) => status != null && status < 500,
              ));
            }

            @override
            void initState() {
              super.initState();
              _downloadTabController = TabController(length: 2, vsync: this);
              _loadBookmarks();
              _loadDownloadedFiles();

              _webController = WebViewController()
                ..setJavaScriptMode(JavaScriptMode.unrestricted)
                ..setUserAgent(mobileUA)
                ..addJavaScriptChannel(
                  'LongPressDetector',
                  onMessageReceived: (JavaScriptMessage msg) {
                    _handleUniversalLongPress(msg.message);
                  },
                )
                ..setNavigationDelegate(
                  NavigationDelegate(
                    onPageStarted: (url) {
                      _searchController.text = url;
                    },
                    onPageFinished: (url) {
                      _webController.runJavaScript(r"""
                        var isBusy = false;
                        document.addEventListener('contextmenu', function(e) {
                          if (isBusy) return;
                          var link = e.target.closest('a');
                          if (link && link.href) {
                            e.preventDefault();
                            isBusy = true;
                            setTimeout(function() { isBusy = false; }, 1200);

                            var title = link.innerText.trim() || link.getAttribute('aria-label') || link.title || 'Item';
                            LongPressDetector.postMessage(JSON.stringify({
                              type: (link.href.includes('watch') || link.href.includes('youtu.be')) ? 'video' : 'folder',
                              url: link.href,
                              name: title
                            }));
                          }
                        }, true);
                      """);
                    },
                  ),
                )
                ..loadRequest(Uri.parse('https://m.youtube.com'));
            }

            void _handleUniversalLongPress(String jsonStr) {
              try {
                var data = jsonDecode(jsonStr);
                String type = data['type'];
                String url = data['url'];
                String name = data['name'];

                if (type == 'video' || url.contains('watch?v=') || url.contains('youtu.be/')) {
                  _fetchYouTubeInfo(url);
                } else {
                  _startDeepCrawlerPrompt(url, name);
                }
              } catch (_) {}
            }

            // DEEP RECURSIVE ENGINE: எத்தனை அடுக்குகள் உள்ளே இருந்தாலும் தேடும் எஞ்சின்
            void _startDeepCrawlerPrompt(String targetUrl, String folderTitle) {
              String rootName = folderTitle.replaceAll(RegExp(r'[^\w\s\-]+'), '').trim();
              if (rootName.isEmpty) rootName = "Tamil Songs";

              showDialog(
                context: context,
                builder: (ctx) => AlertDialog(
                  title: Row(
                    children: [
                      const Icon(Icons.folder_copy, color: Colors.amber, size: 28),
                      const SizedBox(width: 8),
                      Expanded(child: Text(rootName, style: const TextStyle(fontWeight: FontWeight.bold))),
                    ],
                  ),
                  content: Text(
                    "'$rootName' மற்றும் அதனுள் இருக்கும் அனைத்து Subfolders (உள்ளுக்குள் இருக்கும் அனைத்து அடுக்குகளும்) ஆராயப்பட்டு, பாடல்கள் அதே அடைவு அமைப்பில் (Folder Structure) டவுன்லோட் செய்யப்படும். தொடரவா?",
                  ),
                  actions: [
                    TextButton(onPressed: () => Navigator.pop(ctx), child: const Text("Cancel")),
                    ElevatedButton(
                      style: ElevatedButton.styleFrom(backgroundColor: Colors.red),
                      onPressed: () {
                        Navigator.pop(ctx);
                        ScaffoldMessenger.of(context).showSnackBar(SnackBar(content: Text("'$rootName' முழுமையாகத் தேடப்பட்டு டவுன்லோட் துவங்குகிறது...")));
                        // Deep Crawl தொடங்குகிறது
                        _deepCrawlFolder(
                          url: targetUrl,
                          currentFolder: rootName,
                          visited: <String>{},
                          depth: 0,
                        );
                        setState(() => _currentTab = 2);
                      },
                      child: const Text("Start Deep Download", style: TextStyle(color: Colors.white)),
                    )
                  ],
                ),
              );
            }

            // RECURSIVE FUNCTION (Folder ➔ Subfolder ➔ Sub-subfolder...)
            Future<void> _deepCrawlFolder({
              required String url,
              required String currentFolder,
              required Set<String> visited,
              required int depth,
            }) async {
              if (depth > 5 || visited.contains(url)) return;
              visited.add(url);

              try {
                var dio = _getSafeDio(url);
                var res = await dio.get(url);
                String html = res.data.toString();

                // 1. இந்த மட்டத்தில் உள்ள அனைத்து பாடல்களையும் டவுன்லோட் செய்தல்
                final audioRegex = RegExp(
                  r"""["'\(]([^"'()\s<>]+\.(?:mp3|m4a|mp4|wav|aac)[^"'()\s<>]*)["'\)]""",
                  caseSensitive: false,
                );
                for (var m in audioRegex.allMatches(html)) {
                  String raw = m.group(1)!;
                  if (raw.contains('?') && !raw.contains('.mp3')) continue;
                  String fullSongUrl = raw.startsWith('http') ? raw : Uri.parse(url).resolve(raw).toString();

                  _startFileDownload(fullSongUrl, currentFolder, url);
                }

                // 2. உள்ளே இருக்கும் Subfolder-களைத் தேடி அவற்றிற்குள் நுழைதல் (Recursion)
                final linkRegex = RegExp(r"""<a[^>]+href=["']([^"']+)["'][^>]*>(.*?)</a>""", caseSensitive: false, dotAll: true);
                for (var m in linkRegex.allMatches(html)) {
                  String href = m.group(1)!;
                  String subName = m.group(2)!.replaceAll(RegExp(r'<[^>]*>'), '').trim();
                  subName = subName.replaceAll(RegExp(r'[^\w\s\-]+'), '').trim();

                  if (subName.isNotEmpty && subName.length > 2 && !href.startsWith('#') && !href.startsWith('javascript:')) {
                    if (!['Home', 'Songs', 'Bible', 'Quiz', 'Search', 'Contact', 'Facebook', 'About'].contains(subName)) {
                      String nextUrl = href.startsWith('http') ? href : Uri.parse(url).resolve(href).toString();
                      if (!visited.contains(nextUrl) && !nextUrl.contains('.mp3')) {
                        // அடுத்த Subfolder-க்குள் தானாகச் செல்கிறது
                        await _deepCrawlFolder(
                          url: nextUrl,
                          currentFolder: "$currentFolder/$subName",
                          visited: visited,
                          depth: depth + 1,
                        );
                      }
                    }
                  }
                }
              } catch (_) {}
            }

            Future<void> _startFileDownload(String fileUrl, String subfolder, String referer) async {
              String fileName = Uri.decodeComponent(fileUrl.split('/').last.split('?').first);
              if (fileName.isEmpty || !fileName.contains('.')) fileName = "track_${DateTime.now().millisecondsSinceEpoch}.mp3";

              CancelToken cancelToken = CancelToken();
              var task = DownloadTask(
                id: DateTime.now().millisecondsSinceEpoch.toString() + fileUrl.hashCode.toString(),
                name: fileName,
                subfolder: subfolder,
                cancelToken: cancelToken,
              );

              setState(() {
                _activeTasks.add(task);
              });

              try {
                Directory baseDir = Directory('/storage/emulated/0/Download');
                if (!await baseDir.exists()) baseDir = (await getExternalStorageDirectory())!;
                
                // Nested Folders (Download/Tamil Songs/Aalayamani/Folder1/Folder2/) தானாக உருவாகும்
                Directory targetDir = Directory('${baseDir.path}/$subfolder');
                if (!await targetDir.exists()) await targetDir.create(recursive: true);

                String savePath = "${targetDir.path}/$fileName";

                var dio = _getSafeDio(referer);
                await dio.download(
                  fileUrl,
                  savePath,
                  cancelToken: cancelToken,
                  onReceiveProgress: (received, total) {
                    if (total > 0) {
                      setState(() {
                        task.progress = received / total;
                      });
                    }
                  },
                );

                setState(() {
                  task.status = 'completed';
                  _activeTasks.remove(task);
                });
                _loadDownloadedFiles();
              } catch (_) {
                setState(() {
                  task.status = 'failed';
                  _activeTasks.remove(task);
                });
              }
            }

            void _fetchYouTubeInfo(String url) async {
              if (_isBottomSheetOpen || _isLoading) return;
              _isBottomSheetOpen = true;
              _isLoading = true;
              setState(() {});

              var yt = YoutubeExplode();
              try {
                var video = await yt.videos.get(url);
                var manifest = await yt.videos.streamsClient.getManifest(video.id);
                _isLoading = false;
                setState(() {});
                await _showYouTubeQualityDialog(video, manifest);
              } catch (_) {
                _isLoading = false;
                setState(() {});
              } finally {
                yt.close();
                _isBottomSheetOpen = false;
              }
            }

            Future<void> _showYouTubeQualityDialog(Video video, StreamManifest manifest) async {
              String selectedFormat = '720p';
              dynamic selectedStream;
              var muxedStreams = manifest.muxed;
              var audioStreams = manifest.audioOnly;

              await showModalBottomSheet(
                context: context,
                isScrollControlled: true,
                shape: const RoundedRectangleBorder(borderRadius: BorderRadius.vertical(top: Radius.circular(20))),
                builder: (context) {
                  return StatefulBuilder(
                    builder: (context, setModalState) {
                      return Container(
                        padding: const EdgeInsets.all(16),
                        height: MediaQuery.of(context).size.height * 0.75,
                        child: Column(
                          crossAxisAlignment: CrossAxisAlignment.start,
                          children: [
                            Row(
                              children: [
                                ClipRRect(
                                  borderRadius: BorderRadius.circular(8),
                                  child: Image.network(video.thumbnails.mediumResUrl, width: 80, height: 60, fit: BoxFit.cover),
                                ),
                                const SizedBox(width: 12),
                                Expanded(child: Text(video.title, maxLines: 2, overflow: TextOverflow.ellipsis, style: const TextStyle(fontWeight: FontWeight.bold, fontSize: 13))),
                              ],
                            ),
                            const Divider(height: 20),
                            const Text("🎵 Audio", style: TextStyle(fontWeight: FontWeight.bold, color: Colors.red)),
                            RadioListTile(
                              title: Row(
                                children: [
                                  const Text("MP3 Audio"),
                                  const Spacer(),
                                  if (_downloadedQualities['audio'] == true)
                                    const Text("✓✓", style: TextStyle(color: Colors.blue, fontWeight: FontWeight.bold)),
                                ],
                              ),
                              value: 'audio',
                              groupValue: selectedFormat,
                              onChanged: (val) {
                                setModalState(() {
                                  selectedFormat = val.toString();
                                  selectedStream = audioStreams.withHighestBitrate();
                                });
                              },
                            ),
                            const Text("🎬 Video Qualities", style: TextStyle(fontWeight: FontWeight.bold, color: Colors.red)),
                            Expanded(
                              child: ListView(
                                children: [
                                  for (var q in ['1080p', '720p', '480p', '360p', '240p'])
                                    RadioListTile(
                                      title: Row(
                                        children: [
                                          Text("$q HD"),
                                          const Spacer(),
                                          if (_downloadedQualities[q] == true)
                                            const Text("✓✓", style: TextStyle(color: Colors.blue, fontWeight: FontWeight.bold)),
                                        ],
                                      ),
                                      value: q,
                                      groupValue: selectedFormat,
                                      onChanged: (val) {
                                        setModalState(() {
                                          selectedFormat = val.toString();
                                          selectedStream = muxedStreams.firstWhere((s) => s.qualityLabel.contains(q), orElse: () => muxedStreams.first);
                                        });
                                      },
                                    ),
                                ],
                              ),
                            ),
                            SizedBox(
                              width: double.infinity,
                              height: 48,
                              child: ElevatedButton(
                                style: ElevatedButton.styleFrom(backgroundColor: const Color(0xFFFF2B42), shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(25))),
                                child: const Text("DOWNLOAD", style: TextStyle(color: Colors.white, fontWeight: FontWeight.bold, fontSize: 16)),
                                onPressed: () {
                                  Navigator.pop(context);
                                  _downloadYouTubeStream(video, selectedStream ?? muxedStreams.first, selectedFormat);
                                },
                              ),
                            ),
                          ],
                        ),
                      );
                    },
                  );
                },
              );
            }

            Future<void> _downloadYouTubeStream(Video video, dynamic streamInfo, String quality) async {
              String cleanTitle = video.title.replaceAll(RegExp(r'[^\w\s]+'), '');
              String fileName = "$cleanTitle-$quality.mp4";

              var task = DownloadTask(
                id: DateTime.now().millisecondsSinceEpoch.toString(),
                name: fileName,
                subfolder: "YouTube",
              );

              setState(() {
                _activeTasks.add(task);
                _currentTab = 2;
              });

              var yt = YoutubeExplode();
              var stream = yt.videos.streamsClient.get(streamInfo);

              Directory dir = Directory('/storage/emulated/0/Download');
              if (!await dir.exists()) dir = (await getExternalStorageDirectory())!;
              var file = File('${dir.path}/$fileName');

              var fileStream = file.openWrite();
              await stream.pipe(fileStream);
              await fileStream.flush();
              await fileStream.close();
              yt.close();

              setState(() {
                _downloadedQualities[quality] = true;
                _activeTasks.remove(task);
              });
              _loadDownloadedFiles();
              ScaffoldMessenger.of(context).showSnackBar(SnackBar(content: Text("✅ Saved $quality (✓✓)!")));
            }

            Future<void> _loadBookmarks() async {
              final prefs = await SharedPreferences.getInstance();
              final String? data = prefs.getString('saved_bookmarks');
              if (data != null) {
                setState(() {
                  _bookmarks = List<Map<String, String>>.from((jsonDecode(data) as List).map((i) => Map<String, String>.from(i)));
                });
              }
            }

            Future<void> _toggleBookmark() async {
              String? currentUrl = await _webController.currentUrl();
              String? title = await _webController.getTitle();
              if (currentUrl == null) return;

              final prefs = await SharedPreferences.getInstance();
              bool exists = _bookmarks.any((b) => b['url'] == currentUrl);

              setState(() {
                if (exists) {
                  _bookmarks.removeWhere((b) => b['url'] == currentUrl);
                  ScaffoldMessenger.of(context).showSnackBar(const SnackBar(content: Text("Bookmark Removed! ❌")));
                } else {
                  _bookmarks.add({'title': title ?? 'Page', 'url': currentUrl});
                  ScaffoldMessenger.of(context).showSnackBar(const SnackBar(content: Text("Bookmarked! ⭐")));
                }
              });
              await prefs.setString('saved_bookmarks', jsonEncode(_bookmarks));
            }

            Future<void> _loadDownloadedFiles() async {
              try {
                Directory dir = Directory('/storage/emulated/0/Download');
                if (!await dir.exists()) dir = (await getExternalStorageDirectory())!;
                if (await dir.exists()) {
                  setState(() {
                    _downloadedFiles = dir.listSync(recursive: true).where((f) {
                      String ext = f.path.split('.').last.toLowerCase();
                      return ['mp4', 'mp3', 'm4a', 'wav', 'aac'].contains(ext);
                    }).toList();
                  });
                }
              } catch (_) {}
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(
                  backgroundColor: Colors.white,
                  elevation: 1,
                  title: Container(
                    height: 38,
                    decoration: BoxDecoration(color: Colors.grey[200], borderRadius: BorderRadius.circular(20)),
                    child: TextField(
                      controller: _searchController,
                      style: const TextStyle(fontSize: 14),
                      decoration: const InputDecoration(
                        hintText: "Search or enter URL...",
                        prefixIcon: Icon(Icons.search, size: 18, color: Colors.grey),
                        border: InputBorder.none,
                        contentPadding: EdgeInsets.only(top: 8),
                      ),
                      onSubmitted: (url) {
                        String target = url.trim();
                        if (!target.startsWith('http')) target = 'https://m.youtube.com/results?search_query=${Uri.encodeComponent(target)}';
                        _webController.loadRequest(Uri.parse(target));
                      },
                    ),
                  ),
                  actions: [
                    IconButton(
                      icon: Icon(Icons.desktop_windows, size: 21, color: _isDesktopMode ? Colors.blue : Colors.black87),
                      tooltip: "Desktop Mode",
                      onPressed: () async {
                        setState(() => _isDesktopMode = !_isDesktopMode);
                        await _webController.setUserAgent(_isDesktopMode ? desktopUA : mobileUA);
                        await _webController.reload();
                      },
                    ),
                    IconButton(
                      icon: const Icon(Icons.add_box_outlined, size: 21, color: Colors.black87),
                      tooltip: "New Tab",
                      onPressed: () {
                        _searchController.clear();
                        _webController.loadRequest(Uri.parse('https://www.google.com'));
                        setState(() => _currentTab = 0);
                        ScaffoldMessenger.of(context).showSnackBar(const SnackBar(content: Text("New Page Opened! 🌐")));
                      },
                    ),
                    IconButton(
                      icon: const Icon(Icons.star_border, size: 22, color: Colors.amber),
                      tooltip: "Bookmark",
                      onPressed: _toggleBookmark,
                    ),
                    const SizedBox(width: 4),
                  ],
                ),
                body: IndexedStack(
                  index: _currentTab,
                  children: [
                    Stack(
                      children: [
                        WebViewWidget(controller: _webController),
                        if (_isLoading) const Center(child: CircularProgressIndicator(color: Colors.red)),
                      ],
                    ),
                    _bookmarks.isEmpty
                        ? const Center(child: Text("Bookmark எதுவும் இல்லை! ⭐"))
                        : ListView.builder(
                            itemCount: _bookmarks.length,
                            itemBuilder: (ctx, i) => ListTile(
                              leading: const Icon(Icons.bookmark, color: Colors.amber),
                              title: Text(_bookmarks[i]['title'] ?? '', maxLines: 1),
                              onTap: () {
                                _webController.loadRequest(Uri.parse(_bookmarks[i]['url']!));
                                setState(() => _currentTab = 0);
                              },
                            ),
                          ),
                    Column(
                      children: [
                        Container(
                          color: Colors.white,
                          child: TabBar(
                            controller: _downloadTabController,
                            labelColor: Colors.red,
                            unselectedLabelColor: Colors.grey,
                            indicatorColor: Colors.red,
                            tabs: [
                              Tab(text: "Downloading (${_activeTasks.length})"),
                              Tab(text: "Downloaded (${_downloadedFiles.length})"),
                            ],
                          ),
                        ),
                        Expanded(
                          child: TabBarView(
                            controller: _downloadTabController,
                            children: [
                              _activeTasks.isEmpty
                                  ? const Center(child: Text("டவுன்லோட் எதுவும் இல்லை!"))
                                  : ListView.builder(
                                      itemCount: _activeTasks.length,
                                      itemBuilder: (ctx, i) {
                                        var t = _activeTasks[i];
                                        return Card(
                                          margin: const EdgeInsets.symmetric(horizontal: 10, vertical: 6),
                                          child: Padding(
                                            padding: const EdgeInsets.all(12),
                                            child: Column(
                                              crossAxisAlignment: CrossAxisAlignment.start,
                                              children: [
                                                Text(t.name, maxLines: 1, overflow: TextOverflow.ellipsis, style: const TextStyle(fontWeight: FontWeight.bold)),
                                                const SizedBox(height: 4),
                                                Text("📁 Folder: ${t.subfolder}", style: const TextStyle(fontSize: 12, color: Colors.blue)),
                                                const SizedBox(height: 8),
                                                LinearProgressIndicator(value: t.progress > 0 ? t.progress : null, color: Colors.red),
                                                const SizedBox(height: 6),
                                                Text("${(t.progress * 100).toStringAsFixed(1)}%"),
                                              ],
                                            ),
                                          ),
                                        );
                                      },
                                    ),
                              _downloadedFiles.isEmpty
                                  ? const Center(child: Text("கோப்புகள் இல்லை!"))
                                  : ListView.builder(
                                      itemCount: _downloadedFiles.length,
                                      itemBuilder: (ctx, i) {
                                        var f = _downloadedFiles[i];
                                        return ListTile(
                                          leading: const Icon(Icons.music_video, color: Colors.red),
                                          title: Text(f.path.split('/').last, maxLines: 1),
                                          subtitle: Text(f.path.replaceFirst('/storage/emulated/0/Download/', '')),
                                          trailing: IconButton(
                                            icon: const Icon(Icons.delete, color: Colors.grey),
                                            onPressed: () {
                                              f.deleteSync();
                                              _loadDownloadedFiles();
                                            },
                                          ),
                                        );
                                      },
                                    ),
                            ],
                          ),
                        )
                      ],
                    ),
                    const Center(child: Text("VidMate Master Pro")),
                  ],
                ),
                floatingActionButton: _currentTab == 0
                    ? FloatingActionButton(
                        backgroundColor: const Color(0xFFFF2B42),
                        onPressed: () async {
                          String? u = await _webController.currentUrl();
                          if (u != null) {
                            if (u.contains('watch') || u.contains('youtu.be')) {
                              _fetchYouTubeInfo(u);
                            } else {
                              _startDeepCrawlerPrompt(u, "Downloads");
                            }
                          }
                        },
                        child: const Icon(Icons.download, color: Colors.white, size: 28),
                      )
                    : null,
                bottomNavigationBar: BottomNavigationBar(
                  currentIndex: _currentTab,
                  selectedItemColor: Colors.red,
                  unselectedItemColor: Colors.grey,
                  type: BottomNavigationBarType.fixed,
                  onTap: (index) {
                    if (index == 2) _loadDownloadedFiles();
                    setState(() => _currentTab = index);
                  },
                  items: const [
                    BottomNavigationBarItem(icon: Icon(Icons.home), label: "Home"),
                    BottomNavigationBarItem(icon: Icon(Icons.bookmark), label: "Bookmarks"),
                    BottomNavigationBarItem(icon: Icon(Icons.download), label: "Downloads"),
                    BottomNavigationBarItem(icon: Icon(Icons.settings), label: "Settings"),
                  ],
                ),
              );
            }
          }
          EOF

          # Permissions
          sed -i '/<manifest/a \    <uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE"/>\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"/>' android/app/src/main/AndroidManifest.xml
          sed -i 's/<application/<application android:requestLegacyExternalStorage="true"/' android/app/src/main/AndroidManifest.xml

      - name: Build Release APK
        run: |
          cd my_downloader
          flutter build apk --release --build-number=${{ github.run_number }} --build-name=1.0.${{ github.run_number }}

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VidMate-Final-APK
          path: my_downloader/build/app/outputs/flutter-apk/app-release.apk
