                            ),
                          )
                        ],
                      ),
                      const Center(child: Text("VidMate Master Pro")),
                    ],
                  ),
                  bottomNavigationBar: BottomNavigationBar(
                    currentIndex: _currentTab,
                    selectedItemColor: Colors.red,
                    unselectedItemColor: Colors.grey,
                    type: BottomNavigationBarType.fixed,
                    onTap: (index) {
                      if (index == 2) _loadDownloadedFiles();
                      setState(() => _currentTab = index);
                    },
                    items: const [
                      BottomNavigationBarItem(icon: Icon(Icons.home), label: "Home"),
                      BottomNavigationBarItem(icon: Icon(Icons.bookmark), label: "Bookmarks"),
                      BottomNavigationBarItem(icon: Icon(Icons.download), label: "Downloads"),
                      BottomNavigationBarItem(icon: Icon(Icons.settings), label: "Settings"),
                    ],
                  ),
                ),
              );
            }
          }
          EOF

          # Permissions
          sed -i '/<manifest/a \    <uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.CAMERA"/>\n    <uses-permission android:name="android.permission.READ_MEDIA_IMAGES"/>\n    <uses-permission android:name="android.permission.READ_MEDIA_VIDEO"/>\n    <uses-permission android:name="android.permission.READ_MEDIA_AUDIO"/>\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE"/>\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"/>' android/app/src/main/AndroidManifest.xml
          sed -i 's/<application/<application android:usesCleartextTraffic="true" android:requestLegacyExternalStorage="true"/' android/app/src/main/AndroidManifest.xml

          sed -i 's/signingConfig = signingConfigs.release/signingConfig = signingConfigs.debug/g' my_downloader/android/app/build.gradle* 2>/dev/null || true

          # NDK பிழை தடுப்பு
          echo "android.nativeBuildConfigurations.clear()" >> my_downloader/android/app/build.gradle.kts 2>/dev/null || true
          sed -i '/android {/a \    ndkVersion = ""' my_downloader/android/app/build.gradle* 2>/dev/null || true

      - name: Build Release APK with Fixed Permanent Keystore
        run: |
          cd my_downloader
          flutter build apk --release --build-number=${{ github.run_number }} --build-name=1.0.${{ github.run_number }}

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VidMate-Final-APK
          path: my_downloader/build/app/outputs/flutter-apk/app-release.apk
