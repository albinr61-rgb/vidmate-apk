name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # ★ நிலையான விசை (Fixed Keystore) - இனி வாழ்நாளில் Update பிரச்சனை வராது ★
      - name: Generate Fixed Permanent Keystore
        run: |
          mkdir -p ~/.android
          keytool -genkeypair -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=VidMate, OU=Dev, O=App, L=City, S=State, C=IN" -storetype PKCS12 || true

      - name: Create App & Inject Strict Folder Lock Downloader
        run: |
          flutter create my_downloader --org com.myvidmate.app
          cd my_downloader
          
          flutter pub add webview_flutter youtube_explode_dart dio path_provider shared_preferences

          cat << 'EOF' > lib/main.dart
          import 'dart:convert';
          import 'dart:io';
          import 'dart:typed_data';
          import 'package:flutter/material.dart';
          import 'package:webview_flutter/webview_flutter.dart';
          import 'package:youtube_explode_dart/youtube_explode_dart.dart';
          import 'package:path_provider/path_provider.dart';
          import 'package:dio/dio.dart';
          import 'package:shared_preferences/shared_preferences.dart';

          void main() {
            runApp(const MaterialApp(
              debugShowCheckedModeBanner: false,
              home: MainMasterApp(),
            ));
          }

          class DownloadTask {
            final String id;
            final String name;
            final String subfolder;
            final String fileUrl;
            final String sourcePage;
            double progress;
            String status;
            bool isPaused;
            IOSink? sink;
            File? file;

            DownloadTask({
              required this.id,
              required this.name,
              required this.subfolder,
              required this.fileUrl,
              required this.sourcePage,
              this.progress = 0.0,
              this.status = 'queued',
              this.isPaused = false,
              this.sink,
              this.file,
            });
          }

          class MainMasterApp extends StatefulWidget {
            const MainMasterApp({super.key});

            @override
            State<MainMasterApp> createState() => _MainMasterAppState();
          }

          class _MainMasterAppState extends State<MainMasterApp> with SingleTickerProviderStateMixin {
            int _currentTab = 0;
            late TabController _downloadTabController;
            late final WebViewController _webController;
            final TextEditingController _searchController = TextEditingController();
            final FocusNode _searchFocusNode = FocusNode();
            
            bool _isLoading = false;
            bool _isBottomSheetOpen = false;
            bool _isDialogShowing = false;
            bool _isCurrentUrlBookmarked = false;
            DateTime? _lastBackPressTime;

            bool _isDesktopMode = false;
            static const String desktopUA = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36";
            static const String mobileUA = "Mozilla/5.0 (Linux; Android 13; Mobile) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Mobile Safari/537.36";

            final Map<String, DownloadTask> _tasksMap = {};
            final List<String> _downloadQueue = [];

            List<Map<String, String>> _bookmarks = [];
            Map<String, bool> _downloadedQualities = {};
            List<FileSystemEntity> _downloadedFiles = [];

            Dio _getSafeDio(String refererUrl) {
              return Dio(BaseOptions(
                headers: {
                  'User-Agent': _isDesktopMode ? desktopUA : mobileUA,
                  'Accept': '*/*',
                  'Referer': refererUrl,
                },
                followRedirects: true,
                connectTimeout: const Duration(seconds: 30),
                receiveTimeout: const Duration(seconds: 40),
              ));
            }

            @override
            void initState() {
              super.initState();
              _downloadTabController = TabController(length: 2, vsync: this);
              _loadBookmarks();
              _loadDownloadedFiles();

              _searchFocusNode.addListener(() {
                if (mounted) setState(() {});
              });

              _webController = WebViewController()
                ..setJavaScriptMode(JavaScriptMode.unrestricted)
                ..setUserAgent(mobileUA)
                ..addJavaScriptChannel(
                  'VidMateBridge',
                  onMessageReceived: (JavaScriptMessage msg) {
                    _handleBridgeMessage(msg.message);
                  },
                )
                ..setNavigationDelegate(
                  NavigationDelegate(
                    onPageStarted: (url) {
                      _searchController.text = url;
                      _updateBookmarkIcon(url);
                      if (mounted) setState(() => _isLoading = true);
                    },
                    onPageFinished: (url) {
                      if (mounted) setState(() => _isLoading = false);
                      _updateBookmarkIcon(url);

                      _webController.runJavaScript(r"""
                        var touchTimer = null;
                        var isBusy = false;
                        window.__pausedTasks = window.__pausedTasks || {};

                        // In-Browser Stream Chunks
                        window.streamFileFromBrowser = async function(url, taskId) {
                          try {
                            window.__pausedTasks[taskId] = false;
                            var r = await fetch(url, {credentials: 'include', headers: {'Accept': '*/*'}});
                            if (!r.ok) {
                              VidMateBridge.postMessage(JSON.stringify({type: 'dl_fallback', id: taskId, url: url}));
                              return;
                            }
                            var reader = r.body.getReader();
                            var total = parseInt(r.headers.get('content-length') || '0', 10);
                            var loaded = 0;

                            while (true) {
                              if (window.__pausedTasks[taskId]) {
                                reader.cancel();
                                return;
                              }
                              var chunk = await reader.read();
                              if (chunk.done) break;
                              var bytes = chunk.value;
                              loaded += bytes.length;

                              var bin = '';
                              for (var i = 0; i < bytes.length; i += 32768) {
                                bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 32768));
                              }
                              var b64 = btoa(bin);

                              VidMateBridge.postMessage(JSON.stringify({
                                type: 'dl_chunk',
                                id: taskId,
                                data: b64,
                                loaded: loaded,
                                total: total
                              }));
                            }
                            VidMateBridge.postMessage(JSON.stringify({type: 'dl_done', id: taskId}));
                          } catch (e) {
                            if (!window.__pausedTasks[taskId]) {
                              VidMateBridge.postMessage(JSON.stringify({type: 'dl_fallback', id: taskId, url: url}));
                            }
                          }
                        };

                        window.pauseBrowserStream = function(taskId) {
                          window.__pausedTasks[taskId] = true;
                        };

                        // ★ 1800 பாட்டுகள் வராமல், அந்த ஆல்பத்திற்குள் மட்டுமே பூட்டும் Strict Crawler ★
                        function isStrictSubUrl(parentUrl, childUrl) {
                          try {
                            var p = new URL(parentUrl);
                            var c = new URL(childUrl);
                            if (p.hostname.replace(/^www\./,'') !== c.hostname.replace(/^www\./,'')) return false;

                            // Query parameters check (?folder=Deva_Hits / ?album=Deva_Hits)
                            var keys = ['album', 'folder', 'dir', 'cat', 'category', 'id'];
                            for (var i = 0; i < keys.length; i++) {
                              var k = keys[i];
                              var pv = p.searchParams.get(k);
                              var cv = c.searchParams.get(k);
                              if (pv !== null && cv !== null) {
                                return cv.startsWith(pv.replace(/\/+$/, '') + '/') && cv !== pv;
                              }
                            }

                            // Path check (/songs/Deva_Hits/...)
                            var pDir = p.pathname.replace(/\/+$/, '') + '/';
                            if (c.pathname.startsWith(pDir) && c.pathname !== pDir) {
                              return true;
                            }
                            return false;
                          } catch(e) { return false; }
                        }

                        async function crawlAlbumStrictly(folderPath, targetUrl, depth) {
                          if (depth > 3) return;
                          try {
                            var res = await fetch(targetUrl, {credentials: 'include'});
                            if (!res.ok) return;
                            var html = await res.text();
                            var doc = new DOMParser().parseFromString(html, 'text/html');

                            var seen = {};
                            // 1. இந்த ஆல்பத்தில் உள்ள பாடல்களை மட்டும் எடுத்தல்
                            doc.querySelectorAll('a[href], audio, source, [data-url]').forEach(function(el) {
                              var href = el.getAttribute('href') || el.getAttribute('src') || el.getAttribute('data-url');
                              if (href && href.match(/\.mp3/i)) {
                                try {
                                  var full = new URL(href, targetUrl).href;
                                  var sName = el.innerText.trim() || decodeURIComponent(full.split('/').pop().split('?')[0]);
                                  if (!seen[full]) {
                                    seen[full] = true;
                                    VidMateBridge.postMessage(JSON.stringify({
                                      type: 'init_download',
                                      url: full,
                                      subfolder: folderPath,
                                      name: sName,
                                      page: targetUrl
                                    }));
                                  }
                                } catch(x){}
                              }
                            });

                            // 2. வெளி இணைப்புகளுக்கு செல்லாமல், இதன் Subfolder-க்கு மட்டுமே செல்லும் பூட்டு
                            doc.querySelectorAll('a[href]').forEach(function(a) {
                              var aTxt = a.innerText.trim();
                              var aHref = a.getAttribute('href');
                              if (aTxt.length > 1 && aHref && !aHref.startsWith('javascript') && !aHref.includes('#') && !aTxt.endsWith('.mp3')) {
                                try {
                                  var nextUrl = new URL(aHref, targetUrl).href;
                                  if (isStrictSubUrl(targetUrl, nextUrl)) {
                                    crawlAlbumStrictly(folderPath + '/' + aTxt, nextUrl, depth + 1);
                                  }
                                } catch(x){}
                              }
                            });
                          } catch(e){}
                        }

                        window.startStrictCrawl = async function(rootName, rootUrl) {
                          await crawlAlbumStrictly(rootName, rootUrl, 0);
                        };

                        function isVideoLink(link) {
                          var href = (link.href || '').toLowerCase();
                          var text = (link.innerText + ' ' + (link.getAttribute('aria-label') || '')).toLowerCase();
                          if (href.includes('watch') || href.includes('youtu.be') || href.includes('video') || 
                              href.includes('view') || href.includes('play') || href.includes('.mp4') || 
                              href.includes('clip') || href.includes('movie')) return true;
                          if (text.includes('sec') || text.includes('min') || text.includes('360p') || 
                              text.includes('720p') || text.includes('1080p') || text.includes('hd')) return true;
                          if (link.querySelector('img') && (text.match(/\d+:\d+/) || text.match(/\d+\s*min/))) return true;
                          return false;
                        }

                        function processLink(link, ev) {
                          if (isBusy || !link || !link.href) return;
                          isBusy = true;
                          setTimeout(function() { isBusy = false; }, 1800);

                          var img = link.querySelector('img') || (ev.target.tagName === 'IMG' ? ev.target : null);
                          var thumb = img ? img.src : '';
                          var title = link.innerText.trim() || (img ? img.alt : '') || link.title || 'Item';
                          var href = link.href;

                          if (href.includes('watch') || href.includes('youtu.be')) {
                            VidMateBridge.postMessage(JSON.stringify({type: 'youtube', url: href, name: title}));
                            return;
                          }

                          if (isVideoLink(link)) {
                            fetch(href, {credentials: 'include'})
                              .then(function(r){ return r.text(); })
                              .then(function(html){
                                var unescaped = html.replace(/\\\//g, '/');
                                var qs = {};
                                var mp4Regex = /(https?:\/\/[^\s"'<>\\]+?\.(?:mp4|webm|m3u8)(?:\?[^\s"'<>\\]*)?)/gi;
                                var m = unescaped.match(mp4Regex) || [];
                                m.forEach(function(u){
                                  var cl = u.replace(/["']/g, '');
                                  var q = "360p SD";
                                  if (cl.includes('1080')) q = "1080p HD";
                                  else if (cl.includes('720')) q = "720p HD";
                                  else if (cl.includes('480')) q = "480p";
                                  if (!qs[q]) qs[q] = cl;
                                });
                                VidMateBridge.postMessage(JSON.stringify({
                                  type: 'video_qualities',
                                  url: href,
                                  name: title,
                                  thumb: thumb,
                                  qualities: qs
                                }));
                              })
                              .catch(function(){
                                VidMateBridge.postMessage(JSON.stringify({type: 'video_qualities', url: href, name: title, thumb: thumb, qualities: {'Direct MP4': href}}));
                              });
                            return;
                          }

                          VidMateBridge.postMessage(JSON.stringify({
                            type: 'folder_long_press',
                            url: href,
                            name: title
                          }));
                        }

                        document.addEventListener('contextmenu', function(e) {
                          var link = e.target.closest('a');
                          if (link) { e.preventDefault(); processLink(link, e); }
                        }, true);

                        document.addEventListener('touchstart', function(e) {
                          var link = e.target.closest('a');
                          if (link) {
                            touchTimer = setTimeout(function() { processLink(link, e); }, 650);
                          }
                        }, {passive: true});

                        document.addEventListener('touchend', function() { if (touchTimer) clearTimeout(touchTimer); }, {passive: true});
                        document.addEventListener('touchmove', function() { if (touchTimer) clearTimeout(touchTimer); }, {passive: true});
                      """);
                    },
                  ),
                )
                ..loadRequest(Uri.parse('https://m.youtube.com'));
            }

            void _updateBookmarkIcon(String? url) {
              if (url == null) return;
              if (mounted) {
                setState(() {
                  _isCurrentUrlBookmarked = _bookmarks.any((b) => b['url'] == url);
                });
              }
            }

            void _handleBridgeMessage(String jsonStr) {
              try {
                var data = jsonDecode(jsonStr);
                String type = data['type'];

                if (type == 'youtube') {
                  _fetchYouTubeInfo(data['url']);
                } 
                else if (type == 'video_qualities') {
                  Map<String, dynamic> rawQ = data['qualities'] ?? {};
                  String thumb = data['thumb'] ?? '';
                  Map<String, String> qMap = rawQ.map((k, v) => MapEntry(k.toString(), v.toString()));
                  _showVideoQualityDialog(data['name'], thumb, qMap.isNotEmpty ? qMap : {'Original MP4': data['url']}, data['url']);
                } 
                else if (type == 'folder_long_press') {
                  _showSingleMasterConfirmDialog(data['name'], data['url']);
                }
                else if (type == 'init_download') {
                  _enqueueDownload(data['url'], data['subfolder'], data['name'], data['page'] ?? '');
                }
                else if (type == 'dl_chunk') {
                  String taskId = data['id'];
                  String b64 = data['data'];
                  int loaded = data['loaded'] ?? 0;
                  int total = data['total'] ?? 0;

                  var task = _tasksMap[taskId];
                  if (task != null && task.sink != null && !task.isPaused) {
                    Uint8List bytes = base64Decode(b64);
                    task.sink!.add(bytes);
                    if (total > 0 && mounted) {
                      setState(() {
                        task.progress = loaded / total;
                        task.status = 'downloading';
                      });
                    }
                  }
                }
                else if (type == 'dl_done') {
                  _finishTask(data['id'], success: true);
                }
                else if (type == 'dl_fallback') {
                  _fallbackDirectDownload(data['id']);
                }
              } catch (_) {}
            }

            Future<void> _enqueueDownload(String fileUrl, String subfolder, String fileName, String sourcePage) async {
              String taskId = DateTime.now().millisecondsSinceEpoch.toString() + fileUrl.hashCode.toString();
              String name = fileName.replaceAll(RegExp(r'[^\w\s\.\-]+'), '').trim();
              if (!name.toLowerCase().endsWith('.mp3') && !name.toLowerCase().endsWith('.mp4')) {
                name = "$name.mp3";
              }

              var task = DownloadTask(
                id: taskId,
                name: name,
                subfolder: subfolder,
                fileUrl: fileUrl,
                sourcePage: sourcePage.isNotEmpty ? sourcePage : fileUrl,
              );

              setState(() {
                _tasksMap[taskId] = task;
                _downloadQueue.add(taskId);
              });

              _processNextInQueue();
            }

            void _processNextInQueue() async {
              int activeCount = _tasksMap.values.where((t) => t.status == 'downloading').length;
              if (activeCount >= 2 || _downloadQueue.isEmpty) return;

              String nextTaskId = _downloadQueue.removeAt(0);
              var task = _tasksMap[nextTaskId];
              if (task == null) return;

              try {
                Directory baseDir = Directory('/storage/emulated/0/Download');
                try {
                  if (!await baseDir.exists()) baseDir = (await getExternalStorageDirectory())!;
                } catch (_) {
                  baseDir = (await getExternalStorageDirectory())!;
                }

                Directory targetDir = Directory('${baseDir.path}/${task.subfolder}');
                if (!await targetDir.exists()) await targetDir.create(recursive: true);

                File f = File('${targetDir.path}/${task.name}');
                task.sink = f.openWrite();
                task.file = f;
                task.status = 'downloading';

                if (mounted) setState(() {});

                _webController.runJavaScript('''
                  window.streamFileFromBrowser(${jsonEncode(task.fileUrl)}, ${jsonEncode(task.id)});
                ''');
              } catch (e) {
                _fallbackDirectDownload(task.id);
              }
            }

            void _finishTask(String taskId, {required bool success}) {
              var task = _tasksMap[taskId];
              if (task != null) {
                task.sink?.flush();
                task.sink?.close();
                if (mounted) {
                  setState(() {
                    if (success) {
                      _tasksMap.remove(taskId);
                    } else {
                      task.status = 'failed';
                    }
                  });
                  _loadDownloadedFiles();
                }
              }
              _processNextInQueue();
            }

            Future<void> _fallbackDirectDownload(String taskId) async {
              var task = _tasksMap[taskId];
              if (task == null) return;

              try {
                task.sink?.close();
                task.sink = null;
                var dio = _getSafeDio(task.sourcePage);
                await dio.download(
                  task.fileUrl,
                  task.file!.path,
                  onReceiveProgress: (rec, total) {
                    if (total > 0 && mounted) {
                      setState(() {
                        task.progress = rec / total;
                        task.status = 'downloading';
                      });
                    }
                  },
                );
                _finishTask(taskId, success: true);
              } catch (_) {
                _finishTask(taskId, success: false);
              }
            }

            void _showSingleMasterConfirmDialog(String folderName, String folderUrl) {
              if (_isDialogShowing) return;
              _isDialogShowing = true;

              String cleanName = folderName.replaceAll(RegExp(r'[^\w\s\-]+'), '').trim();
              if (cleanName.isEmpty) cleanName = "Songs";

              showDialog(
                context: context,
                barrierDismissible: false,
                builder: (ctx) => AlertDialog(
                  title: Row(
                    children: [
                      const Icon(Icons.folder, color: Colors.amber, size: 28),
                      const SizedBox(width: 8),
                      Expanded(child: Text(cleanName, style: const TextStyle(fontWeight: FontWeight.bold))),
                    ],
                  ),
                  content: Text(
                    "'$cleanName' ஆல்பத்தில் உள்ள பாடல்களை மட்டும் Download/$cleanName/ ஃபோல்டரில் டவுன்லோட் செய்யவா?",
                  ),
                  actions: [
                    TextButton(
                      onPressed: () {
                        _isDialogShowing = false;
                        Navigator.pop(ctx);
                      },
                      child: const Text("Cancel"),
                    ),
                    ElevatedButton(
                      style: ElevatedButton.styleFrom(backgroundColor: Colors.red),
                      onPressed: () {
                        _isDialogShowing = false;
                        Navigator.pop(ctx);
                        ScaffoldMessenger.of(context).showSnackBar(
                          SnackBar(content: Text("'$cleanName' டவுன்லோட் தொடங்குகிறது...")),
                        );

                        // Strict URL Lock உடன் ஆல்பம் மட்டுமே டவுன்லோட் ஆகும்
                        _webController.runJavaScript('''
                          window.startStrictCrawl(${jsonEncode(cleanName)}, ${jsonEncode(folderUrl)});
                        ''');
                        setState(() => _currentTab = 2);
                      },
                      child: const Text("Download", style: TextStyle(color: Colors.white, fontWeight: FontWeight.bold)),
                    )
                  ],
                ),
              ).then((_) => _isDialogShowing = false);
            }

            void _togglePause(DownloadTask task) {
              setState(() {
                task.isPaused = !task.isPaused;
              });

              if (task.isPaused) {
                _webController.runJavaScript('window.pauseBrowserStream(${jsonEncode(task.id)});');
                ScaffoldMessenger.of(context).showSnackBar(SnackBar(content: Text("${task.name} Paused")));
              } else {
                _webController.runJavaScript('window.streamFileFromBrowser(${jsonEncode(task.fileUrl)}, ${jsonEncode(task.id)});');
                ScaffoldMessenger.of(context).showSnackBar(SnackBar(content: Text("${task.name} Resumed")));
              }
            }

            void _showVideoQualityDialog(String title, String thumb, Map<String, String> qualities, String referer) {
              String selectedFormat = qualities.keys.first;

              showModalBottomSheet(
                context: context,
                isScrollControlled: true,
                shape: const RoundedRectangleBorder(borderRadius: BorderRadius.vertical(top: Radius.circular(20))),
                builder: (context) {
                  return StatefulBuilder(
                    builder: (context, setModalState) {
                      return Container(
                        padding: const EdgeInsets.all(16),
                        height: MediaQuery.of(context).size.height * 0.65,
                        child: Column(
                          crossAxisAlignment: CrossAxisAlignment.start,
                          children: [
                            Row(
                              children: [
                                if (thumb.isNotEmpty)
                                  ClipRRect(
                                    borderRadius: BorderRadius.circular(8),
                                    child: Image.network(thumb, width: 80, height: 60, fit: BoxFit.cover, errorBuilder: (_, __, ___) => const Icon(Icons.video_library, size: 40)),
                                  )
                                else
                                  const Icon(Icons.video_library, size: 50, color: Colors.red),
                                const SizedBox(width: 12),
                                Expanded(child: Text(title, maxLines: 2, overflow: TextOverflow.ellipsis, style: const TextStyle(fontWeight: FontWeight.bold, fontSize: 13))),
                              ],
                            ),
                            const Divider(height: 20),
                            const Text("🎬 Video Qualities", style: TextStyle(fontWeight: FontWeight.bold, color: Colors.red)),
                            const SizedBox(height: 8),
                            Expanded(
                              child: ListView(
                                children: [
                                  for (var q in qualities.keys)
                                    RadioListTile(
                                      title: Row(
                                        children: [
                                          Text(q),
                                          const Spacer(),
                                          if (_downloadedQualities[q] == true)
                                            const Text("✓✓", style: TextStyle(color: Colors.blue, fontWeight: FontWeight.bold)),
                                        ],
                                      ),
                                      value: q,
                                      groupValue: selectedFormat,
                                      onChanged: (val) {
                                        setModalState(() {
                                          selectedFormat = val.toString();
                                        });
                                      },
                                    ),
                                ],
                              ),
                            ),
                            SizedBox(
                              width: double.infinity,
                              height: 48,
                              child: ElevatedButton(
                                style: ElevatedButton.styleFrom(backgroundColor: const Color(0xFFFF2B42), shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(25))),
                                child: const Text("DOWNLOAD", style: TextStyle(color: Colors.white, fontWeight: FontWeight.bold, fontSize: 16)),
                                onPressed: () {
                                  Navigator.pop(context);
                                  String streamUrl = qualities[selectedFormat]!;
                                  String cleanTitle = title.replaceAll(RegExp(r'[^\w\s]+'), '').trim();
                                  if (cleanTitle.isEmpty) cleanTitle = "Video";
                                  _enqueueDownload(streamUrl, "Videos", "$cleanTitle-$selectedFormat.mp4", referer);
                                  setState(() {
                                    _downloadedQualities[selectedFormat] = true;
                                    _currentTab = 2;
                                  });
                                },
                              ),
                            ),
                          ],
                        ),
                      );
                    },
                  );
                },
              );
            }

            void _fetchYouTubeInfo(String url) async {
              if (_isBottomSheetOpen || _isLoading) return;
              _isBottomSheetOpen = true;
              if (mounted) setState(() => _isLoading = true);

              var yt = YoutubeExplode();
              try {
                var video = await yt.videos.get(url);
                var manifest = await yt.videos.streamsClient.getManifest(video.id);
                if (mounted) setState(() => _isLoading = false);
                await _showYouTubeQualityDialog(video, manifest);
              } catch (_) {
                if (mounted) setState(() => _isLoading = false);
              } finally {
                yt.close();
                _isBottomSheetOpen = false;
              }
            }

            Future<void> _showYouTubeQualityDialog(Video video, StreamManifest manifest) async {
              String selectedFormat = '720p';
              dynamic selectedStream;
              var muxedStreams = manifest.muxed;
              var audioStreams = manifest.audioOnly;

              await showModalBottomSheet(
                context: context,
                isScrollControlled: true,
                shape: const RoundedRectangleBorder(borderRadius: BorderRadius.vertical(top: Radius.circular(20))),
                builder: (context) {
                  return StatefulBuilder(
                    builder: (context, setModalState) {
                      return Container(
                        padding: const EdgeInsets.all(16),
                        height: MediaQuery.of(context).size.height * 0.75,
                        child: Column(
                          crossAxisAlignment: CrossAxisAlignment.start,
                          children: [
                            Row(
                              children: [
                                ClipRRect(
                                  borderRadius: BorderRadius.circular(8),
                                  child: Image.network(video.thumbnails.mediumResUrl, width: 80, height: 60, fit: BoxFit.cover),
                                ),
                                const SizedBox(width: 12),
                                Expanded(child: Text(video.title, maxLines: 2, overflow: TextOverflow.ellipsis, style: const TextStyle(fontWeight: FontWeight.bold, fontSize: 13))),
                              ],
                            ),
                            const Divider(height: 20),
                            const Text("🎵 Audio", style: TextStyle(fontWeight: FontWeight.bold, color: Colors.red)),
                            RadioListTile(
                              title: Row(
                                children: [
                                  const Text("MP3 Audio"),
                                  const Spacer(),
                                  if (_downloadedQualities['audio'] == true)
                                    const Text("✓✓", style: TextStyle(color: Colors.blue, fontWeight: FontWeight.bold)),
                                ],
                              ),
                              value: 'audio',
                              groupValue: selectedFormat,
                              onChanged: (val) {
                                setModalState(() {
                                  selectedFormat = val.toString();
                                  selectedStream = audioStreams.withHighestBitrate();
                                });
                              },
                            ),
                            const Text("🎬 Video Qualities", style: TextStyle(fontWeight: FontWeight.bold, color: Colors.red)),
                            Expanded(
                              child: ListView(
                                children: [
                                  for (var q in ['1080p', '720p', '480p', '360p', '240p'])
                                    RadioListTile(
                                      title: Row(
                                        children: [
                                          Text("$q HD"),
                                          const Spacer(),
                                          if (_downloadedQualities[q] == true)
                                            const Text("✓✓", style: TextStyle(color: Colors.blue, fontWeight: FontWeight.bold)),
                                        ],
                                      ),
                                      value: q,
                                      groupValue: selectedFormat,
                                      onChanged: (val) {
                                        setModalState(() {
                                          selectedFormat = val.toString();
                                          selectedStream = muxedStreams.firstWhere((s) => s.qualityLabel.contains(q), orElse: () => muxedStreams.first);
                                        });
                                      },
                                    ),
                                ],
                              ),
                            ),
                            SizedBox(
                              width: double.infinity,
                              height: 48,
                              child: ElevatedButton(
                                style: ElevatedButton.styleFrom(backgroundColor: const Color(0xFFFF2B42), shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(25))),
                                child: const Text("DOWNLOAD", style: TextStyle(color: Colors.white, fontWeight: FontWeight.bold, fontSize: 16)),
                                onPressed: () {
                                  Navigator.pop(context);
                                  _downloadYouTubeStream(video, selectedStream ?? muxedStreams.first, selectedFormat);
                                },
                              ),
                            ),
                          ],
                        ),
                      );
                    },
                  );
                },
              );
            }

            Future<void> _downloadYouTubeStream(Video video, dynamic streamInfo, String quality) async {
              String cleanTitle = video.title.replaceAll(RegExp(r'[^\w\s]+'), '');
              String fileName = "$cleanTitle-$quality.mp4";
              String taskId = DateTime.now().millisecondsSinceEpoch.toString();

              Directory baseDir = Directory('/storage/emulated/0/Download');
              if (!await baseDir.exists()) baseDir = (await getExternalStorageDirectory())!;
              var file = File('${baseDir.path}/$fileName');
              var fileStream = file.openWrite();

              var task = DownloadTask(
                id: taskId,
                name: fileName,
                subfolder: "YouTube",
                fileUrl: video.url,
                sourcePage: video.url,
                sink: fileStream,
                file: file,
              );

              setState(() {
                _tasksMap[taskId] = task;
                _currentTab = 2;
              });

              var yt = YoutubeExplode();
              var stream = yt.videos.streamsClient.get(streamInfo);

              await stream.pipe(fileStream);
              await fileStream.flush();
              await fileStream.close();
              yt.close();

              setState(() {
                _downloadedQualities[quality] = true;
                _tasksMap.remove(taskId);
              });
              _loadDownloadedFiles();
              ScaffoldMessenger.of(context).showSnackBar(SnackBar(content: Text("✅ Saved $quality (✓✓)!")));
            }

            Future<void> _loadBookmarks() async {
              final prefs = await SharedPreferences.getInstance();
              final String? data = prefs.getString('saved_bookmarks');
              if (data != null) {
                setState(() {
                  _bookmarks = List<Map<String, String>>.from((jsonDecode(data) as List).map((i) => Map<String, String>.from(i)));
                });
              }
            }

            Future<void> _toggleBookmark() async {
              String? currentUrl = await _webController.currentUrl();
              String? title = await _webController.getTitle();
              if (currentUrl == null) return;

              final prefs = await SharedPreferences.getInstance();
              bool exists = _bookmarks.any((b) => b['url'] == currentUrl);

              setState(() {
                if (exists) {
                  _bookmarks.removeWhere((b) => b['url'] == currentUrl);
                  _isCurrentUrlBookmarked = false;
                  ScaffoldMessenger.of(context).showSnackBar(const SnackBar(content: Text("Bookmark நீக்கப்பட்டது! ❌")));
                } else {
                  _bookmarks.add({'title': title ?? 'Page', 'url': currentUrl});
                  _isCurrentUrlBookmarked = true;
                  ScaffoldMessenger.of(context).showSnackBar(const SnackBar(content: Text("Bookmark சேமிக்கப்பட்டது! ⭐")));
                }
              });
              await prefs.setString('saved_bookmarks', jsonEncode(_bookmarks));
            }

            Future<void> _loadDownloadedFiles() async {
              try {
                Directory dir = Directory('/storage/emulated/0/Download');
                if (!await dir.exists()) dir = (await getExternalStorageDirectory())!;
                if (await dir.exists()) {
                  setState(() {
                    _downloadedFiles = dir.listSync(recursive: true).where((f) {
                      String ext = f.path.split('.').last.toLowerCase();
                      return ['mp4', 'mp3', 'm4a', 'wav', 'aac'].contains(ext);
                    }).toList();
                  });
                }
              } catch (_) {}
            }

            void _handleGoOrReload() {
              if (_searchFocusNode.hasFocus) {
                _searchFocusNode.unfocus();
                String target = _searchController.text.trim();
                if (!target.startsWith('http')) target = 'https://m.youtube.com/results?search_query=${Uri.encodeComponent(target)}';
                _webController.loadRequest(Uri.parse(target));
              } else if (_isLoading) {
                _webController.runJavaScript('window.stop();');
                setState(() => _isLoading = false);
              } else {
                _webController.reload();
              }
            }

            Future<bool> _handleWillPop() async {
              if (_currentTab != 0) {
                setState(() => _currentTab = 0);
                return false;
              }
              if (await _webController.canGoBack()) {
                await _webController.goBack();
                return false;
              }

              DateTime now = DateTime.now();
              if (_lastBackPressTime == null || now.difference(_lastBackPressTime!) > const Duration(seconds: 2)) {
                _lastBackPressTime = now;
                ScaffoldMessenger.of(context).showSnackBar(
                  const SnackBar(
                    content: Text("வெளியேற மீண்டும் Back பட்டனை அழுத்தவும்"),
                    duration: Duration(seconds: 2),
                  ),
                );
                return false;
              }
              return true;
            }

            @override
            Widget build(BuildContext context) {
              var tasksList = _tasksMap.values.toList();

              return WillPopScope(
                onWillPop: _handleWillPop,
                child: Scaffold(
                  appBar: AppBar(
                    backgroundColor: Colors.white,
                    elevation: 1,
                    title: Container(
                      height: 38,
                      decoration: BoxDecoration(color: Colors.grey[200], borderRadius: BorderRadius.circular(20)),
                      child: TextField(
                        controller: _searchController,
                        focusNode: _searchFocusNode,
                        style: const TextStyle(fontSize: 14),
                        decoration: InputDecoration(
                          hintText: "Search or enter URL...",
                          prefixIcon: const Icon(Icons.search, size: 18, color: Colors.grey),
                          suffixIcon: IconButton(
                            icon: Icon(
                              _searchFocusNode.hasFocus
                                  ? Icons.arrow_forward
                                  : (_isLoading ? Icons.close : Icons.refresh),
                              size: 18,
                              color: _searchFocusNode.hasFocus ? Colors.red : Colors.grey[700],
                            ),
                            onPressed: _handleGoOrReload,
                          ),
                          border: InputBorder.none,
                          contentPadding: const EdgeInsets.only(top: 8),
                        ),
                        onSubmitted: (url) {
                          _searchFocusNode.unfocus();
                          String target = url.trim();
                          if (!target.startsWith('http')) target = 'https://m.youtube.com/results?search_query=${Uri.encodeComponent(target)}';
                          _webController.loadRequest(Uri.parse(target));
                        },
                      ),
                    ),
                    actions: [
                      IconButton(
                        icon: Icon(Icons.desktop_windows, size: 21, color: _isDesktopMode ? Colors.blue : Colors.black87),
                        tooltip: "Desktop Mode",
                        onPressed: () async {
                          setState(() => _isDesktopMode = !_isDesktopMode);
                          await _webController.setUserAgent(_isDesktopMode ? desktopUA : mobileUA);
                          await _webController.reload();
                        },
                      ),
                      IconButton(
                        icon: const Icon(Icons.add_box_outlined, size: 21, color: Colors.black87),
                        tooltip: "New Tab",
                        onPressed: () {
                          _searchController.clear();
                          _webController.loadRequest(Uri.parse('https://www.google.com'));
                          setState(() => _currentTab = 0);
                        },
                      ),
                      IconButton(
                        icon: Icon(
                          _isCurrentUrlBookmarked ? Icons.star : Icons.star_border,
                          size: 22,
                          color: _isCurrentUrlBookmarked ? Colors.amber : Colors.grey,
                        ),
                        tooltip: "Bookmark",
                        onPressed: _toggleBookmark,
                      ),
                      const SizedBox(width: 4),
                    ],
                  ),
                  body: IndexedStack(
                    index: _currentTab,
                    children: [
                      Stack(
                        children: [
                          WebViewWidget(controller: _webController),
                          if (_isLoading) const Center(child: CircularProgressIndicator(color: Colors.red)),
                        ],
                      ),
                      _bookmarks.isEmpty
                          ? const Center(child: Text("Bookmark எதுவும் இல்லை! ⭐"))
                          : ListView.builder(
                              itemCount: _bookmarks.length,
                              itemBuilder: (ctx, i) => ListTile(
                                leading: const Icon(Icons.bookmark, color: Colors.amber),
                                title: Text(_bookmarks[i]['title'] ?? '', maxLines: 1),
                                onTap: () {
                                  _webController.loadRequest(Uri.parse(_bookmarks[i]['url']!));
                                  setState(() => _currentTab = 0);
                                },
                              ),
                            ),
                      Column(
                        children: [
                          Container(
                            color: Colors.white,
                            child: TabBar(
                              controller: _downloadTabController,
                              labelColor: Colors.red,
                              unselectedLabelColor: Colors.grey,
                              indicatorColor: Colors.red,
                              tabs: [
                                Tab(text: "Downloading (${tasksList.length})"),
                                Tab(text: "Downloaded (${_downloadedFiles.length})"),
                              ],
                            ),
                          ),
                          Expanded(
                            child: TabBarView(
                              controller: _downloadTabController,
                              children: [
                                tasksList.isEmpty
                                    ? const Center(child: Text("டவுன்லோட் எதுவும் இல்லை!"))
                                    : ListView.builder(
                                        itemCount: tasksList.length,
                                        itemBuilder: (ctx, i) {
                                          var t = tasksList[i];
                                          return Card(
                                            margin: const EdgeInsets.symmetric(horizontal: 10, vertical: 6),
                                            child: Padding(
                                              padding: const EdgeInsets.all(12),
                                              child: Column(
                                                crossAxisAlignment: CrossAxisAlignment.start,
                                                children: [
                                                  Text(t.name, maxLines: 1, overflow: TextOverflow.ellipsis, style: const TextStyle(fontWeight: FontWeight.bold)),
                                                  const SizedBox(height: 4),
                                                  Text("📁 Folder: ${t.subfolder}", style: const TextStyle(fontSize: 12, color: Colors.blue)),
                                                  const SizedBox(height: 8),
                                                  LinearProgressIndicator(
                                                    value: t.progress > 0 ? t.progress : null,
                                                    color: t.isPaused ? Colors.orange : Colors.red,
                                                    backgroundColor: Colors.grey[200],
                                                  ),
                                                  const SizedBox(height: 6),
                                                  Row(
                                                    children: [
                                                      Text(
                                                        t.isPaused ? "Paused" : "${(t.progress * 100).toStringAsFixed(1)}%",
                                                        style: TextStyle(
                                                          fontSize: 12,
                                                          color: t.isPaused ? Colors.orange : Colors.black87,
                                                          fontWeight: FontWeight.bold,
                                                        ),
                                                      ),
                                                      const Spacer(),
                                                      IconButton(
                                                        icon: const Icon(Icons.open_in_browser, size: 20, color: Colors.blue),
                                                        tooltip: "Go to Source Page",
                                                        onPressed: () {
                                                          if (t.sourcePage.isNotEmpty) {
                                                            _webController.loadRequest(Uri.parse(t.sourcePage));
                                                            setState(() => _currentTab = 0);
                                                          }
                                                        },
                                                      ),
                                                      IconButton(
                                                        icon: Icon(
                                                          t.isPaused ? Icons.play_arrow : Icons.pause,
                                                          size: 20,
                                                          color: t.isPaused ? Colors.green : Colors.orange,
                                                        ),
                                                        tooltip: t.isPaused ? "Resume" : "Pause",
                                                        onPressed: () => _togglePause(t),
                                                      ),
                                                      IconButton(
                                                        icon: const Icon(Icons.close, size: 20, color: Colors.grey),
                                                        onPressed: () {
                                                          t.sink?.close();
