name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Configure Permanent Signing Keystore (For Direct App Updates)
        run: |
          mkdir -p ~/.android
          curl -L -o ~/.android/debug.keystore https://raw.githubusercontent.com/CoreProc/android-debug-keystore/master/debug.keystore

      - name: Create App & Inject Smart Downloader Code
        run: |
          flutter create my_downloader --org com.myvidmate.app
          cd my_downloader
          
          flutter pub add webview_flutter youtube_explode_dart dio path_provider shared_preferences

          cat << 'EOF' > lib/main.dart
          import 'dart:convert';
          import 'dart:io';
          import 'package:flutter/material.dart';
          import 'package:webview_flutter/webview_flutter.dart';
          import 'package:youtube_explode_dart/youtube_explode_dart.dart';
          import 'package:path_provider/path_provider.dart';
          import 'package:dio/dio.dart';
          import 'package:shared_preferences/shared_preferences.dart';

          void main() {
            runApp(const MaterialApp(
              debugShowCheckedModeBanner: false,
              home: MainMasterApp(),
            ));
          }

          class DownloadTask {
            final String id;
            final String name;
            final String subfolder;
            double progress;
            String status;
            CancelToken? cancelToken;

            DownloadTask({
              required this.id,
              required this.name,
              required this.subfolder,
              this.progress = 0.0,
              this.status = 'downloading',
              this.cancelToken,
            });
          }

          class MainMasterApp extends StatefulWidget {
            const MainMasterApp({super.key});

            @override
            State<MainMasterApp> createState() => _MainMasterAppState();
          }

          class _MainMasterAppState extends State<MainMasterApp> with SingleTickerProviderStateMixin {
            int _currentTab = 0;
            late TabController _downloadTabController;
            late final WebViewController _webController;
            final TextEditingController _searchController = TextEditingController();
            bool _isLoading = false;

            List<DownloadTask> _activeTasks = [];
            List<Map<String, String>> _bookmarks = [];
            Map<String, bool> _downloadedQualities = {};
            List<FileSystemEntity> _downloadedFiles = [];

            @override
            void initState() {
              super.initState();
              _downloadTabController = TabController(length: 2, vsync: this);
              _loadBookmarks();
              _loadDownloadedFiles();

              _webController = WebViewController()
                ..setJavaScriptMode(JavaScriptMode.unrestricted)
                ..addJavaScriptChannel(
                  'FolderDownloader',
                  onMessageReceived: (JavaScriptMessage message) {
                    _handleFolderLongPress(message.message);
                  },
                )
                ..setNavigationDelegate(
                  NavigationDelegate(
                    onPageStarted: (url) {
                      _searchController.text = url;
                      _autoDetectYouTube(url);
                    },
                    onPageFinished: (url) {
                      _webController.runJavaScript(r"""
                        document.addEventListener('contextmenu', function(e) {
                          var target = e.target.closest('a');
                          if (target && target.href) {
                            e.preventDefault();
                            var fName = target.innerText.trim() || target.pathname.split('/').filter(Boolean).pop() || 'Folder';
                            FolderDownloader.postMessage(JSON.stringify({url: target.href, name: fName}));
                          }
                        });
                      """);
                    },
                  ),
                )
                ..loadRequest(Uri.parse('https://m.youtube.com'));
            }

            Future<void> _loadBookmarks() async {
              final prefs = await SharedPreferences.getInstance();
              final String? data = prefs.getString('saved_bookmarks');
              if (data != null) {
                setState(() {
                  _bookmarks = List<Map<String, String>>.from(
                    (jsonDecode(data) as List).map((item) => Map<String, String>.from(item)),
                  );
                });
              }
            }

            Future<void> _toggleBookmark() async {
              String? currentUrl = await _webController.currentUrl();
              String? title = await _webController.getTitle();
              if (currentUrl == null) return;

              final prefs = await SharedPreferences.getInstance();
              bool exists = _bookmarks.any((b) => b['url'] == currentUrl);

              setState(() {
                if (exists) {
                  _bookmarks.removeWhere((b) => b['url'] == currentUrl);
                  ScaffoldMessenger.of(context).showSnackBar(const SnackBar(content: Text("Bookmark Removed! ❌")));
                } else {
                  _bookmarks.add({'title': title ?? 'Page', 'url': currentUrl});
                  ScaffoldMessenger.of(context).showSnackBar(const SnackBar(content: Text("Bookmarked! ⭐")));
                }
              });
              await prefs.setString('saved_bookmarks', jsonEncode(_bookmarks));
            }

            Future<void> _loadDownloadedFiles() async {
              try {
                Directory dir = Directory('/storage/emulated/0/Download');
                if (!await dir.exists()) dir = (await getExternalStorageDirectory())!;
                if (await dir.exists()) {
                  setState(() {
                    _downloadedFiles = dir.listSync(recursive: true).where((f) {
                      String ext = f.path.split('.').last.toLowerCase();
                      return ['mp4', 'mp3', 'm4a', 'wav', 'aac'].contains(ext);
                    }).toList();
                  });
                }
              } catch (_) {}
            }

            // சரிசெய்யப்பட்ட Smart Media Crawler (Syntax Error நீக்கப்பட்டது)
            Future<void> _handleFolderLongPress(String jsonStr) async {
              try {
                var data = jsonDecode(jsonStr);
                String folderUrl = data['url'];
                String folderName = data['name'].replaceAll(RegExp(r'[^\w\s\-]+'), '').trim();

                ScaffoldMessenger.of(context).showSnackBar(SnackBar(content: Text("'$folderName' ஆராயப்படுகிறது...")));

                var response = await Dio().get(folderUrl);
                String html = response.data.toString();

                final regex = RegExp(
                  r"""(?:href|src)\s*=\s*["']([^"']+\.(?:mp3|m4a|mp4|wav|aac)[^"']*)["']""",
                  caseSensitive: false,
                );
                var matches = regex.allMatches(html);
                List<String> mediaUrls = [];

                for (var m in matches) {
                  String link = m.group(1)!;
                  if (!link.startsWith('http')) {
                    link = Uri.parse(folderUrl).resolve(link).toString();
                  }
                  if (!mediaUrls.contains(link)) mediaUrls.add(link);
                }

                if (mediaUrls.isNotEmpty) {
                  showDialog(
                    context: context,
                    builder: (ctx) => AlertDialog(
                      title: Text("📁 $folderName Album"),
                      content: Text("இந்த Folder-ல் ${mediaUrls.length} பாடல்கள் உள்ளன! அனைத்தையும் Subfolder-ல் டவுன்லோட் செய்யவா?"),
                      actions: [
                        TextButton(onPressed: () => Navigator.pop(ctx), child: const Text("Cancel")),
                        ElevatedButton(
                          style: ElevatedButton.styleFrom(backgroundColor: Colors.red),
                          onPressed: () {
                            Navigator.pop(ctx);
                            for (var songUrl in mediaUrls) {
                              _startFileDownload(songUrl, folderName);
                            }
                            setState(() => _currentTab = 2);
                          },
                          child: Text("Download All (${mediaUrls.length})", style: const TextStyle(color: Colors.white)),
                        )
                      ],
                    ),
                  );
                } else {
                  if (folderUrl.endsWith('.mp3') || folderUrl.endsWith('.mp4')) {
                    _startFileDownload(folderUrl, folderName);
                  } else {
                    ScaffoldMessenger.of(context).showSnackBar(const SnackBar(content: Text("இந்தப் பக்கத்தில் நேரடியாக பாடல்கள் இல்லை. Folder-ஐ கிளிக் செய்து உள்ளே செல்லுங்கள்!")));
                  }
                }
              } catch (e) {
                ScaffoldMessenger.of(context).showSnackBar(SnackBar(content: Text("Error: $e")));
              }
            }

            Future<void> _startFileDownload(String fileUrl, String subfolder) async {
              String fileName = Uri.decodeComponent(fileUrl.split('/').last.split('?').first);
              if (fileName.isEmpty || !fileName.contains('.')) fileName = "song_${DateTime.now().millisecondsSinceEpoch}.mp3";

              CancelToken cancelToken = CancelToken();
              var task = DownloadTask(
                id: DateTime.now().millisecondsSinceEpoch.toString(),
                name: fileName,
                subfolder: subfolder,
                cancelToken: cancelToken,
              );

              setState(() {
                _activeTasks.add(task);
              });

              try {
                Directory baseDir = Directory('/storage/emulated/0/Download');
                if (!await baseDir.exists()) baseDir = (await getExternalStorageDirectory())!;
                
                Directory targetDir = Directory('${baseDir.path}/$subfolder');
                if (!await targetDir.exists()) await targetDir.create(recursive: true);

                String savePath = "${targetDir.path}/$fileName";

                await Dio().download(
                  fileUrl,
                  savePath,
                  cancelToken: cancelToken,
                  onReceiveProgress: (received, total) {
                    if (total > 0) {
                      setState(() {
                        task.progress = received / total;
                      });
                    }
                  },
                );

                setState(() {
                  task.status = 'completed';
                  _activeTasks.remove(task);
                });
                _loadDownloadedFiles();
              } catch (_) {
                setState(() {
                  task.status = 'failed';
                  _activeTasks.remove(task);
                });
              }
            }

            void _autoDetectYouTube(String url) {
              if (url.contains('watch?v=') || url.contains('youtu.be/') || url.contains('/shorts/')) {
                _fetchYouTubeInfo(url);
              }
            }

            void _fetchYouTubeInfo(String url) async {
              setState(() => _isLoading = true);
              var yt = YoutubeExplode();
              try {
                var video = await yt.videos.get(url);
                var manifest = await yt.videos.streamsClient.getManifest(video.id);
                setState(() => _isLoading = false);
                _showYouTubeQualityDialog(video, manifest);
              } catch (_) {
                setState(() => _isLoading = false);
              } finally {
                yt.close();
              }
            }

            void _showYouTubeQualityDialog(Video video, StreamManifest manifest) {
              String selectedFormat = '720p';
              dynamic selectedStream;
              var muxedStreams = manifest.muxed;
              var audioStreams = manifest.audioOnly;

              showModalBottomSheet(
                context: context,
                isScrollControlled: true,
                shape: const RoundedRectangleBorder(borderRadius: BorderRadius.vertical(top: Radius.circular(20))),
                builder: (context) {
                  return StatefulBuilder(
                    builder: (context, setModalState) {
                      return Container(
                        padding: const EdgeInsets.all(16),
                        height: MediaQuery.of(context).size.height * 0.75,
                        child: Column(
                          crossAxisAlignment: CrossAxisAlignment.start,
                          children: [
                            Row(
                              children: [
                                ClipRRect(
                                  borderRadius: BorderRadius.circular(8),
                                  child: Image.network(video.thumbnails.mediumResUrl, width: 80, height: 60, fit: BoxFit.cover),
                                ),
                                const SizedBox(width: 12),
                                Expanded(child: Text(video.title, maxLines: 2, overflow: TextOverflow.ellipsis, style: const TextStyle(fontWeight: FontWeight.bold, fontSize: 13))),
                              ],
                            ),
                            const Divider(height: 20),
                            const Text("🎵 Audio", style: TextStyle(fontWeight: FontWeight.bold, color: Colors.red)),
                            RadioListTile(
                              title: Row(
                                children: [
                                  const Text("MP3 Audio"),
                                  const Spacer(),
                                  if (_downloadedQualities['audio'] == true)
                                    const Text("✓✓", style: TextStyle(color: Colors.blue, fontWeight: FontWeight.bold)),
                                ],
                              ),
                              value: 'audio',
                              groupValue: selectedFormat,
                              onChanged: (val) {
                                setModalState(() {
                                  selectedFormat = val.toString();
                                  selectedStream = audioStreams.withHighestBitrate();
                                });
                              },
                            ),
                            const Text("🎬 Video Qualities", style: TextStyle(fontWeight: FontWeight.bold, color: Colors.red)),
                            Expanded(
                              child: ListView(
                                children: [
                                  for (var q in ['1080p', '720p', '480p', '360p', '240p'])
                                    RadioListTile(
                                      title: Row(
                                        children: [
                                          Text("$q HD"),
                                          const Spacer(),
                                          if (_downloadedQualities[q] == true)
                                            const Text("✓✓", style: TextStyle(color: Colors.blue, fontWeight: FontWeight.bold)),
                                        ],
                                      ),
                                      value: q,
                                      groupValue: selectedFormat,
                                      onChanged: (val) {
                                        setModalState(() {
                                          selectedFormat = val.toString();
                                          selectedStream = muxedStreams.firstWhere((s) => s.qualityLabel.contains(q), orElse: () => muxedStreams.first);
                                        });
                                      },
                                    ),
                                ],
                              ),
                            ),
                            SizedBox(
                              width: double.infinity,
                              height: 48,
                              child: ElevatedButton(
                                style: ElevatedButton.styleFrom(backgroundColor: const Color(0xFFFF2B42), shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(25))),
                                child: const Text("DOWNLOAD", style: TextStyle(color: Colors.white, fontWeight: FontWeight.bold, fontSize: 16)),
                                onPressed: () {
                                  Navigator.pop(context);
                                  _downloadYouTubeStream(video, selectedStream ?? muxedStreams.first, selectedFormat);
                                },
                              ),
                            ),
                          ],
                        ),
                      );
                    },
                  );
                },
              );
            }

            Future<void> _downloadYouTubeStream(Video video, dynamic streamInfo, String quality) async {
              String cleanTitle = video.title.replaceAll(RegExp(r'[^\w\s]+'), '');
              String fileName = "$cleanTitle-$quality.mp4";

              var task = DownloadTask(
                id: DateTime.now().millisecondsSinceEpoch.toString(),
                name: fileName,
                subfolder: "YouTube",
              );

              setState(() {
                _activeTasks.add(task);
                _currentTab = 2;
              });

              var yt = YoutubeExplode();
              var stream = yt.videos.streamsClient.get(streamInfo);

              Directory dir = Directory('/storage/emulated/0/Download');
              if (!await dir.exists()) dir = (await getExternalStorageDirectory())!;
              var file = File('${dir.path}/$fileName');

              var fileStream = file.openWrite();
              await stream.pipe(fileStream);
              await fileStream.flush();
              await fileStream.close();
              yt.close();

              setState(() {
                _downloadedQualities[quality] = true;
                _activeTasks.remove(task);
              });
              _loadDownloadedFiles();
              ScaffoldMessenger.of(context).showSnackBar(SnackBar(content: Text("✅ Saved $quality (✓✓)!")));
            }

            Future<void> _scanCurrentPageForMedia() async {
              String? currentUrl = await _webController.currentUrl();
              if (currentUrl == null) return;

              if (currentUrl.contains('youtube.com') || currentUrl.contains('youtu.be')) {
                _fetchYouTubeInfo(currentUrl);
              } else {
                ScaffoldMessenger.of(context).showSnackBar(const SnackBar(content: Text("பாடல்கள் தேடப்படுகின்றன...")));
                var result = await _webController.runJavaScriptReturningResult(r"""
                  (function() {
                    var links = [];
                    var pattern = /\.(mp3|m4a|mp4|wav|aac)(\?.*)?$/i;
                    document.querySelectorAll('a, audio, source').forEach(function(el) {
                      var src = el.href || el.src;
                      if (src && pattern.test(src)) {
                        links.push(src);
                      }
                    });
                    return JSON.stringify(Array.from(new Set(links)));
                  })()
                """);

                if (result != null) {
                  try {
                    var decoded = jsonDecode(result.toString());
                    if (decoded is String) decoded = jsonDecode(decoded);
                    List<dynamic> urls = decoded is List ? decoded : [];

                    if (urls.isNotEmpty) {
                      showDialog(
                        context: context,
                        builder: (ctx) => AlertDialog(
                          title: const Text("🎵 Media Found!"),
                          content: Text("இந்தப் பக்கத்தில் ${urls.length} பாடல்கள் உள்ளன. அனைத்தையும் டவுன்லோட் செய்யவா?"),
                          actions: [
                            TextButton(onPressed: () => Navigator.pop(ctx), child: const Text("Cancel")),
                            ElevatedButton(
                              onPressed: () {
                                Navigator.pop(ctx);
                                for (var u in urls) {
                                  _startFileDownload(u.toString(), "Website_Downloads");
                                }
                                setState(() => _currentTab = 2);
                              },
                              child: const Text("Download All"),
                            )
                          ],
                        ),
                      );
                    } else {
                      ScaffoldMessenger.of(context).showSnackBar(const SnackBar(content: Text("பாடல்கள் எதுவும் கிடைக்கவில்லை!")));
                    }
                  } catch (_) {}
                }
              }
            }

            void _navigate(String input) {
              String target = input.trim();
              if (!target.startsWith('http://') && !target.startsWith('https://')) {
                target = 'https://m.youtube.com/results?search_query=${Uri.encodeComponent(target)}';
              }
              _webController.loadRequest(Uri.parse(target));
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(
                  backgroundColor: Colors.white,
                  elevation: 1,
                  title: Container(
                    height: 40,
                    decoration: BoxDecoration(color: Colors.grey[200], borderRadius: BorderRadius.circular(20)),
                    child: TextField(
                      controller: _searchController,
                      decoration: InputDecoration(
                        hintText: "Search or type URL...",
                        prefixIcon: const Icon(Icons.search, size: 20, color: Colors.grey),
                        suffixIcon: IconButton(icon: const Icon(Icons.arrow_forward, size: 18, color: Colors.red), onPressed: () => _navigate(_searchController.text)),
                        border: InputBorder.none,
                        contentPadding: const EdgeInsets.only(top: 8),
                      ),
                      onSubmitted: _navigate,
                    ),
                  ),
                  actions: [
                    IconButton(
                      icon: const Icon(Icons.add_box_outlined, color: Colors.black87),
                      onPressed: () {
                        _searchController.clear();
                        _webController.loadRequest(Uri.parse('https://www.google.com'));
                        setState(() => _currentTab = 0);
                      },
                    ),
                    IconButton(
                      icon: const Icon(Icons.star_border, color: Colors.amber),
                      onPressed: _toggleBookmark,
                    ),
                  ],
                ),

                body: IndexedStack(
                  index: _currentTab,
                  children: [
                    Stack(
                      children: [
                        WebViewWidget(controller: _webController),
                        if (_isLoading) const Center(child: CircularProgressIndicator(color: Colors.red)),
                      ],
                    ),

                    _bookmarks.isEmpty
                        ? const Center(child: Text("Bookmark எதுவும் இல்லை! ⭐"))
                        : ListView.builder(
                            itemCount: _bookmarks.length,
                            itemBuilder: (ctx, i) => ListTile(
                              leading: const Icon(Icons.bookmark, color: Colors.amber),
                              title: Text(_bookmarks[i]['title'] ?? '', maxLines: 1),
                              subtitle: Text(_bookmarks[i]['url'] ?? '', maxLines: 1),
                              onTap: () {
                                _webController.loadRequest(Uri.parse(_bookmarks[i]['url']!));
                                setState(() => _currentTab = 0);
                              },
                            ),
                          ),

                    Column(
                      children: [
                        Container(
                          color: Colors.white,
                          child: TabBar(
                            controller: _downloadTabController,
                            labelColor: Colors.red,
                            unselectedLabelColor: Colors.grey,
                            indicatorColor: Colors.red,
                            tabs: [
                              Tab(text: "Downloading (${_activeTasks.length})"),
                              Tab(text: "Downloaded (${_downloadedFiles.length})"),
                            ],
                          ),
                        ),
                        Expanded(
                          child: TabBarView(
                            controller: _downloadTabController,
                            children: [
                              _activeTasks.isEmpty
                                  ? const Center(child: Text("தற்போது எதுவும் டவுன்லோட் ஆகவில்லை!"))
                                  : ListView.builder(
                                      itemCount: _activeTasks.length,
                                      itemBuilder: (ctx, i) {
                                        var task = _activeTasks[i];
                                        return Card(
                                          margin: const EdgeInsets.symmetric(horizontal: 10, vertical: 6),
                                          child: Padding(
                                            padding: const EdgeInsets.all(12),
                                            child: Column(
                                              crossAxisAlignment: CrossAxisAlignment.start,
                                              children: [
                                                Text(task.name, maxLines: 1, overflow: TextOverflow.ellipsis, style: const TextStyle(fontWeight: FontWeight.bold)),
                                                const SizedBox(height: 4),
                                                Text("Folder: ${task.subfolder}", style: const TextStyle(fontSize: 12, color: Colors.grey)),
                                                const SizedBox(height: 8),
                                                LinearProgressIndicator(value: task.progress > 0 ? task.progress : null, color: Colors.red),
                                                const SizedBox(height: 6),
                                                Row(
                                                  mainAxisAlignment: MainAxisAlignment.spaceBetween,
                                                  children: [
                                                    Text("${(task.progress * 100).toStringAsFixed(1)}%"),
                                                    IconButton(
                                                      icon: const Icon(Icons.cancel, color: Colors.grey, size: 20),
                                                      onPressed: () {
                                                        task.cancelToken?.cancel();
                                                        setState(() => _activeTasks.remove(task));
                                                      },
                                                    )
                                                  ],
                                                )
                                              ],
                                            ),
                                          ),
                                        );
                                      },
                                    ),

                              _downloadedFiles.isEmpty
                                  ? const Center(child: Text("டவுன்லோட் முடிந்த கோப்புகள் இல்லை!"))
                                  : ListView.builder(
                                      itemCount: _downloadedFiles.length,
                                      itemBuilder: (ctx, i) {
                                        var file = _downloadedFiles[i];
                                        String name = file.path.split('/').last;
                                        return ListTile(
                                          leading: const Icon(Icons.music_video, color: Colors.red),
                                          title: Text(name, maxLines: 2, style: const TextStyle(fontSize: 13)),
                                          subtitle: Text("${(file.statSync().size / (1024 * 1024)).toStringAsFixed(2)} MB"),
                                          trailing: IconButton(
                                            icon: const Icon(Icons.delete, color: Colors.grey),
                                            onPressed: () {
                                              file.deleteSync();
                                              _loadDownloadedFiles();
                                            },
                                          ),
                                        );
                                      },
                                    ),
                            ],
                          ),
                        ),
                      ],
                    ),

                    ListView(
                      padding: const EdgeInsets.all(16),
                      children: [
                        const ListTile(
                          leading: Icon(Icons.folder, color: Colors.blue),
                          title: Text("Download Path"),
                          subtitle: Text("/storage/emulated/0/Download"),
                        ),
                        const Divider(),
                        ListTile(
                          leading: const Icon(Icons.cleaning_services, color: Colors.orange),
                          title: const Text("Clear Browser Cache"),
                          onTap: () async {
                            await _webController.clearCache();
                            ScaffoldMessenger.of(context).showSnackBar(const SnackBar(content: Text("Cache Cleared! 🧹")));
                          },
                        ),
                        const Divider(),
                        const ListTile(
                          leading: Icon(Icons.verified, color: Colors.green),
                          title: Text("VidMate Pro Edition"),
                          subtitle: Text("Permanent Signed Version"),
                        ),
                      ],
                    ),
                  ],
                ),

                floatingActionButton: _currentTab == 0
                    ? FloatingActionButton(
                        backgroundColor: const Color(0xFFFF2B42),
                        onPressed: _scanCurrentPageForMedia,
                        child: const Icon(Icons.download, color: Colors.white, size: 28),
                      )
                    : null,

                bottomNavigationBar: BottomNavigationBar(
                  currentIndex: _currentTab,
                  selectedItemColor: Colors.red,
                  unselectedItemColor: Colors.grey,
                  type: BottomNavigationBarType.fixed,
                  onTap: (index) {
                    if (index == 2) _loadDownloadedFiles();
                    setState(() => _currentTab = index);
                  },
                  items: const [
                    BottomNavigationBarItem(icon: Icon(Icons.home), label: "Home"),
                    BottomNavigationBarItem(icon: Icon(Icons.bookmark), label: "Bookmarks"),
                    BottomNavigationBarItem(icon: Icon(Icons.download), label: "Downloads"),
                    BottomNavigationBarItem(icon: Icon(Icons.settings), label: "Settings"),
                  ],
                ),
              );
            }
          }
          EOF

          # Permissions
          sed -i '/<manifest/a \    <uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE"/>\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"/>' android/app/src/main/AndroidManifest.xml
          sed -i 's/<application/<application android:requestLegacyExternalStorage="true"/' android/app/src/main/AndroidManifest.xml

      - name: Build Release APK with Permanent Signature
        run: |
          cd my_downloader
          flutter build apk --release --build-number=${{ github.run_number }} --build-name=1.0.${{ github.run_number }}

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VidMate-Final-APK
          path: my_downloader/build/app/outputs/flutter-apk/app-release.apk
