name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Create App & Inject Advanced VidMate Code
        run: |
          flutter create my_downloader --org com.myvidmate.app
          cd my_downloader
          
          flutter pub add webview_flutter youtube_explode_dart dio path_provider

          cat << 'EOF' > lib/main.dart
          import 'dart:convert';
          import 'dart:io';
          import 'package:flutter/material.dart';
          import 'package:webview_flutter/webview_flutter.dart';
          import 'package:youtube_explode_dart/youtube_explode_dart.dart';
          import 'package:path_provider/path_provider.dart';
          import 'package:dio/dio.dart';

          void main() {
            runApp(const MaterialApp(
              debugShowCheckedModeBanner: false,
              home: AdvancedVidMateApp(),
            ));
          }

          class AdvancedVidMateApp extends StatefulWidget {
            const AdvancedVidMateApp({super.key});

            @override
            State<AdvancedVidMateApp> createState() => _AdvancedVidMateAppState();
          }

          class _AdvancedVidMateAppState extends State<AdvancedVidMateApp> {
            late final WebViewController _controller;
            final TextEditingController _searchController = TextEditingController();
            bool _isLoading = false;
            
            // டவுன்லோட் ஆன Quality-க்கு Double Tick (✓✓) வைக்க
            Map<String, bool> downloadedQualities = {};

            @override
            void initState() {
              super.initState();
              _controller = WebViewController()
                ..setJavaScriptMode(JavaScriptMode.unrestricted)
                ..addJavaScriptChannel(
                  'FolderDownloader',
                  onMessageReceived: (JavaScriptMessage message) {
                    _handleLongPressDownload(message.message);
                  },
                )
                ..setNavigationDelegate(
                  NavigationDelegate(
                    onPageStarted: (url) {
                      _searchController.text = url;
                      _checkAndAutoDetectYouTube(url);
                    },
                    onUrlChange: (change) {
                      if (change.url != null) {
                        _searchController.text = change.url!;
                        _checkAndAutoDetectYouTube(change.url!);
                      }
                    },
                    onPageFinished: (url) {
                      // 3. Website-ல் உள்ள Folder/Link-ஐ Long Press செய்தால் கண்டறியும் JS
                      _controller.runJavaScript('''
                        document.addEventListener('contextmenu', function(e) {
                          var target = e.target.closest('a');
                          if (target && target.href) {
                            e.preventDefault();
                            var folderName = target.innerText.trim() || target.pathname.split('/').filter(Boolean).pop() || 'Folder';
                            FolderDownloader.postMessage(JSON.stringify({
                              url: target.href,
                              name: folderName
                            }));
                          }
                        });
                      ''');
                    },
                  ),
                )
                ..loadRequest(Uri.parse('https://m.youtube.com'));
            }

            // 2. YouTube Video-ஐ Play பண்ணாமலேயே கண்டறிவது
            void _checkAndAutoDetectYouTube(String url) {
              if (url.contains('watch?v=') || url.contains('youtu.be/') || url.contains('/shorts/')) {
                _fetchVideoDetails(url);
              }
            }

            // 3. Long Press செய்த Folder-ஐ Subfolder உருவாக்கி Download செய்வது
            void _handleLongPressDownload(String jsonStr) {
              try {
                var data = jsonDecode(jsonStr);
                String folderUrl = data['url'];
                String folderName = data['name'].replaceAll(RegExp(r'[^\w\s\-]+'), '').trim();

                showDialog(
                  context: context,
                  builder: (ctx) => AlertDialog(
                    title: const Text("📁 Subfolder Download"),
                    content: Text("'$folderName' என்ற பெயரில் Folder உருவாக்கி இந்த ஃபைலை டவுன்லோட் செய்யவா?"),
                    actions: [
                      TextButton(onPressed: () => Navigator.pop(ctx), child: const Text("Cancel")),
                      ElevatedButton(
                        style: ElevatedButton.styleFrom(backgroundColor: Colors.red),
                        onPressed: () {
                          Navigator.pop(ctx);
                          _downloadFolderFile(folderUrl, folderName);
                        },
                        child: const Text("Download Folder", style: TextStyle(color: Colors.white)),
                      )
                    ],
                  ),
                );
              } catch (_) {}
            }

            Future<void> _downloadFolderFile(String fileUrl, String folderName) async {
              ScaffoldMessenger.of(context).showSnackBar(SnackBar(content: Text("'$folderName' Folder-ல் டவுன்லோட் துவங்குகிறது...")));
              try {
                Directory baseDir = Directory('/storage/emulated/0/Download');
                if (!await baseDir.exists()) {
                  baseDir = (await getExternalStorageDirectory())!;
                }
                // அதே பெயரில் Subfolder உருவாக்குகிறோம்
                Directory targetSubFolder = Directory('${baseDir.path}/$folderName');
                if (!await targetSubFolder.exists()) {
                  await targetSubFolder.create(recursive: true);
                }

                String fileName = fileUrl.split('/').last.split('?').first;
                if (fileName.isEmpty || !fileName.contains('.')) fileName = "downloaded_file.mp4";
                String savePath = "${targetSubFolder.path}/$fileName";

                Dio dio = Dio();
                await dio.download(fileUrl, savePath);

                ScaffoldMessenger.of(context).showSnackBar(SnackBar(content: Text("✅ Saved inside: Download/$folderName/$fileName")));
              } catch (e) {
                ScaffoldMessenger.of(context).showSnackBar(SnackBar(content: Text("Download Error: $e")));
              }
            }

            // 1. அனைத்து Qualities மற்றும் டவுன்லோட் செய்த தரத்திற்கு Double Tick (✓✓)
            void _showDownloadDialog(Video video, StreamManifest manifest) {
              String selectedFormat = '720p';
              dynamic selectedStream;

              var videoStreams = manifest.videoOnly.sortByVideoQuality();
              var muxedStreams = manifest.muxed;
              var audioStreams = manifest.audioOnly;

              showModalBottomSheet(
                context: context,
                isScrollControlled: true,
                shape: const RoundedRectangleBorder(borderRadius: BorderRadius.vertical(top: Radius.circular(20))),
                builder: (context) {
                  return StatefulBuilder(
                    builder: (context, setModalState) {
                      return Container(
                        padding: const EdgeInsets.all(16),
                        height: MediaQuery.of(context).size.height * 0.78,
                        child: Column(
                          crossAxisAlignment: CrossAxisAlignment.start,
                          children: [
                            Row(
                              children: [
                                ClipRRect(
                                  borderRadius: BorderRadius.circular(8),
                                  child: Image.network(video.thumbnails.mediumResUrl, width: 85, height: 60, fit: BoxFit.cover),
                                ),
                                const SizedBox(width: 12),
                                Expanded(
                                  child: Text(video.title, maxLines: 2, overflow: TextOverflow.ellipsis, style: const TextStyle(fontWeight: FontWeight.bold, fontSize: 13)),
                                ),
                              ],
                            ),
                            const Divider(height: 20),

                            const Text("🎵 Music (Audio)", style: TextStyle(fontWeight: FontWeight.bold, color: Colors.red)),
                            RadioListTile(
                              title: Row(
                                children: [
                                  const Text("Audio (MP3 / M4A)"),
                                  const Spacer(),
                                  if (downloadedQualities['audio'] == true)
                                    const Row(
                                      children: [
                                        Icon(Icons.done_all, color: Colors.blue, size: 20),
                                        SizedBox(width: 3),
                                        Text("✓✓", style: TextStyle(color: Colors.blue, fontWeight: FontWeight.bold)),
                                      ],
                                    ),
                                ],
                              ),
                              value: 'audio',
                              groupValue: selectedFormat,
                              onChanged: (val) {
                                setModalState(() {
                                  selectedFormat = val.toString();
                                  selectedStream = audioStreams.withHighestBitrate();
                                });
                              },
                            ),

                            const Text("🎬 Video (All Qualities)", style: TextStyle(fontWeight: FontWeight.bold, color: Colors.red)),
                            Expanded(
                              child: ListView(
                                children: [
                                  for (var quality in ['1080p', '720p', '480p', '360p', '240p', '144p'])
                                    RadioListTile(
                                      title: Row(
                                        children: [
                                          Text("$quality HD"),
                                          const Spacer(),
                                          // Double Tick (✓✓) காட்சி
                                          if (downloadedQualities[quality] == true)
                                            const Row(
                                              children: [
                                                Icon(Icons.done_all, color: Colors.blue, size: 20),
                                                SizedBox(width: 3),
                                                Text("✓✓", style: TextStyle(color: Colors.blue, fontWeight: FontWeight.bold)),
                                              ],
                                            ),
                                        ],
                                      ),
                                      value: quality,
                                      groupValue: selectedFormat,
                                      onChanged: (val) {
                                        setModalState(() {
                                          selectedFormat = val.toString();
                                          selectedStream = muxedStreams.firstWhere(
                                            (s) => s.qualityLabel.contains(quality),
                                            orElse: () => muxedStreams.first,
                                          );
                                        });
                                      },
                                    ),
                                ],
                              ),
                            ),

                            SizedBox(
                              width: double.infinity,
                              height: 48,
                              child: ElevatedButton(
                                style: ElevatedButton.styleFrom(
                                  backgroundColor: const Color(0xFFFF2B42),
                                  shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(25)),
                                ),
                                child: const Text("DOWNLOAD", style: TextStyle(color: Colors.white, fontWeight: FontWeight.bold, fontSize: 16)),
                                onPressed: () {
                                  Navigator.pop(context);
                                  _startDownload(video, selectedStream ?? muxedStreams.first, selectedFormat);
                                },
                              ),
                            ),
                          ],
                        ),
                      );
                    },
                  );
                },
              );
            }

            Future<void> _fetchVideoDetails(String url) async {
              setState(() => _isLoading = true);
              var yt = YoutubeExplode();
              try {
                var video = await yt.videos.get(url);
                var manifest = await yt.videos.streamsClient.getManifest(video.id);
                setState(() => _isLoading = false);
                _showDownloadDialog(video, manifest);
              } catch (e) {
                setState(() => _isLoading = false);
              } finally {
                yt.close();
              }
            }

            Future<void> _startDownload(Video video, dynamic streamInfo, String qualityKey) async {
              ScaffoldMessenger.of(context).showSnackBar(SnackBar(content: Text("$qualityKey டவுன்லோட் தொடங்குகிறது...")));

              var yt = YoutubeExplode();
              var stream = yt.videos.streamsClient.get(streamInfo);

              Directory dir = Directory('/storage/emulated/0/Download');
              if (!await dir.exists()) {
                dir = (await getExternalStorageDirectory())!;
              }

              var cleanTitle = video.title.replaceAll(RegExp(r'[^\w\s]+'), '');
              var file = File('${dir.path}/$cleanTitle-$qualityKey.mp4');

              var fileStream = file.openWrite();
              await stream.pipe(fileStream);
              await fileStream.flush();
              await fileStream.close();
              yt.close();

              // டவுன்லோட் முடிந்ததும் Double Tick (✓✓) ஆக மாற்றுகிறோம்
              setState(() {
                downloadedQualities[qualityKey] = true;
              });

              ScaffoldMessenger.of(context).showSnackBar(SnackBar(content: Text("✅ $qualityKey டவுன்லோட் முடிந்தது (✓✓)!")));
            }

            void _navigateToUrl(String value) {
              String target = value.trim();
              if (!target.startsWith('http://') && !target.startsWith('https://')) {
                target = 'https://m.youtube.com/results?search_query=${Uri.encodeComponent(target)}';
              }
              _controller.loadRequest(Uri.parse(target));
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(
                  backgroundColor: Colors.white,
                  elevation: 1,
                  title: Container(
                    height: 42,
                    decoration: BoxDecoration(color: Colors.grey[200], borderRadius: BorderRadius.circular(20)),
                    child: TextField(
                      controller: _searchController,
                      decoration: InputDecoration(
                        hintText: "Search YouTube or enter website...",
                        prefixIcon: const Icon(Icons.search, color: Colors.grey),
                        suffixIcon: IconButton(
                          icon: const Icon(Icons.arrow_forward, color: Colors.red),
                          onPressed: () => _navigateToUrl(_searchController.text),
                        ),
                        border: InputBorder.none,
                        contentPadding: const EdgeInsets.only(top: 8),
                      ),
                      onSubmitted: _navigateToUrl,
                    ),
                  ),
                ),
                body: Stack(
                  children: [
                    WebViewWidget(controller: _controller),
                    if (_isLoading)
                      const Positioned(
                        top: 10,
                        right: 10,
                        child: CircularProgressIndicator(color: Colors.red),
                      ),
                  ],
                ),
                floatingActionButton: FloatingActionButton(
                  backgroundColor: const Color(0xFFFF2B42),
                  onPressed: () async {
                    String? url = await _controller.currentUrl();
                    if (url != null) _fetchVideoDetails(url);
                  },
                  child: const Icon(Icons.download, color: Colors.white, size: 30),
                ),
              );
            }
          }
          EOF

          # Permissions
          sed -i '/<manifest/a \    <uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE"/>\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"/>' android/app/src/main/AndroidManifest.xml
          sed -i 's/<application/<application android:requestLegacyExternalStorage="true"/' android/app/src/main/AndroidManifest.xml

      - name: Build Release APK
        run: |
          cd my_downloader
          flutter build apk --release --build-number=${{ github.run_number }} --build-name=1.0.${{ github.run_number }}

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VidMate-Advanced-APK
          path: my_downloader/build/app/outputs/flutter-apk/app-release.apk
