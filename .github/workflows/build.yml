name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Create App & Inject Full Browser Code
        run: |
          flutter create my_downloader --org com.myvidmate.app
          cd my_downloader
          
          # தேவையான அனைத்து Libraries
          flutter pub add webview_flutter youtube_explode_dart dio path_provider shared_preferences

          cat << 'EOF' > lib/main.dart
          import 'dart:convert';
          import 'dart:io';
          import 'package:flutter/material.dart';
          import 'package:webview_flutter/webview_flutter.dart';
          import 'package:youtube_explode_dart/youtube_explode_dart.dart';
          import 'package:path_provider/path_provider.dart';
          import 'package:dio/dio.dart';
          import 'package:shared_preferences/shared_preferences.dart';

          void main() {
            runApp(const MaterialApp(
              debugShowCheckedModeBanner: false,
              home: MainMasterApp(),
            ));
          }

          class MainMasterApp extends StatefulWidget {
            const MainMasterApp({super.key});

            @override
            State<MainMasterApp> createState() => _MainMasterAppState();
          }

          class _MainMasterAppState extends State<MainMasterApp> {
            int _currentTab = 0;
            late final WebViewController _webController;
            final TextEditingController _searchController = TextEditingController();
            bool _isLoading = false;

            // Bookmark List & Download Status
            List<Map<String, String>> _bookmarks = [];
            Map<String, bool> _downloadedQualities = {};
            List<FileSystemEntity> _downloadedFiles = [];

            @override
            void initState() {
              super.initState();
              _loadBookmarks();
              _loadDownloadedFiles();

              _webController = WebViewController()
                ..setJavaScriptMode(JavaScriptMode.unrestricted)
                ..addJavaScriptChannel(
                  'FolderDownloader',
                  onMessageReceived: (JavaScriptMessage message) {
                    _handleFolderDownload(message.message);
                  },
                )
                ..setNavigationDelegate(
                  NavigationDelegate(
                    onPageStarted: (url) {
                      _searchController.text = url;
                      _autoDetectYouTube(url);
                    },
                    onPageFinished: (url) {
                      _webController.runJavaScript('''
                        document.addEventListener('contextmenu', function(e) {
                          var target = e.target.closest('a');
                          if (target && target.href) {
                            e.preventDefault();
                            var fName = target.innerText.trim() || target.pathname.split('/').filter(Boolean).pop() || 'Folder';
                            FolderDownloader.postMessage(JSON.stringify({url: target.href, name: fName}));
                          }
                        });
                      ''');
                    },
                  ),
                )
                ..loadRequest(Uri.parse('https://m.youtube.com'));
            }

            // 1. Bookmark சேமிப்பது மற்றும் ஏற்றுவது
            Future<void> _loadBookmarks() async {
              final prefs = await SharedPreferences.getInstance();
              final String? data = prefs.getString('saved_bookmarks');
              if (data != null) {
                setState(() {
                  _bookmarks = List<Map<String, String>>.from(
                    (jsonDecode(data) as List).map((item) => Map<String, String>.from(item)),
                  );
                });
              }
            }

            Future<void> _toggleBookmark() async {
              String? currentUrl = await _webController.currentUrl();
              String? title = await _webController.getTitle();
              if (currentUrl == null || currentUrl.isEmpty) return;

              final prefs = await SharedPreferences.getInstance();
              bool exists = _bookmarks.any((b) => b['url'] == currentUrl);

              setState(() {
                if (exists) {
                  _bookmarks.removeWhere((b) => b['url'] == currentUrl);
                  ScaffoldMessenger.of(context).showSnackBar(const SnackBar(content: Text("Bookmark Removed! ❌")));
                } else {
                  _bookmarks.add({'title': title ?? 'Page', 'url': currentUrl});
                  ScaffoldMessenger.of(context).showSnackBar(const SnackBar(content: Text("Bookmarked! ⭐")));
                }
              });

              await prefs.setString('saved_bookmarks', jsonEncode(_bookmarks));
            }

            // 2. டவுன்லோட் செய்த கோப்புகளைப் பார்ப்பது
            Future<void> _loadDownloadedFiles() async {
              try {
                Directory dir = Directory('/storage/emulated/0/Download');
                if (!await dir.exists()) {
                  dir = (await getExternalStorageDirectory())!;
                }
                if (await dir.exists()) {
                  setState(() {
                    _downloadedFiles = dir.listSync().where((f) {
                      String ext = f.path.split('.').last.toLowerCase();
                      return ['mp4', 'mp3', 'm4a', 'mkv', 'webm'].contains(ext);
                    }).toList();
                  });
                }
              } catch (_) {}
            }

            // 3. YouTube Auto Detect (Play பண்ணாமல் Download)
            void _autoDetectYouTube(String url) {
              if (url.contains('watch?v=') || url.contains('youtu.be/') || url.contains('/shorts/')) {
                _fetchVideoInfo(url);
              }
            }

            // 4. Download Bottom Sheet with Double Tick (✓✓)
            void _showDownloadDialog(Video video, StreamManifest manifest) {
              String selectedFormat = '720p';
              dynamic selectedStream;

              var muxedStreams = manifest.muxed;
              var audioStreams = manifest.audioOnly;

              showModalBottomSheet(
                context: context,
                isScrollControlled: true,
                shape: const RoundedRectangleBorder(borderRadius: BorderRadius.vertical(top: Radius.circular(20))),
                builder: (context) {
                  return StatefulBuilder(
                    builder: (context, setModalState) {
                      return Container(
                        padding: const EdgeInsets.all(16),
                        height: MediaQuery.of(context).size.height * 0.75,
                        child: Column(
                          crossAxisAlignment: CrossAxisAlignment.start,
                          children: [
                            Row(
                              children: [
                                ClipRRect(
                                  borderRadius: BorderRadius.circular(8),
                                  child: Image.network(video.thumbnails.mediumResUrl, width: 80, height: 60, fit: BoxFit.cover),
                                ),
                                const SizedBox(width: 12),
                                Expanded(
                                  child: Text(video.title, maxLines: 2, overflow: TextOverflow.ellipsis, style: const TextStyle(fontWeight: FontWeight.bold, fontSize: 13)),
                                ),
                              ],
                            ),
                            const Divider(height: 20),
                            const Text("🎵 Audio", style: TextStyle(fontWeight: FontWeight.bold, color: Colors.red)),
                            RadioListTile(
                              title: Row(
                                children: [
                                  const Text("MP3 / M4A Audio"),
                                  const Spacer(),
                                  if (_downloadedQualities['audio'] == true)
                                    const Text("✓✓", style: TextStyle(color: Colors.blue, fontWeight: FontWeight.bold)),
                                ],
                              ),
                              value: 'audio',
                              groupValue: selectedFormat,
                              onChanged: (val) {
                                setModalState(() {
                                  selectedFormat = val.toString();
                                  selectedStream = audioStreams.withHighestBitrate();
                                });
                              },
                            ),
                            const Text("🎬 Video Qualities", style: TextStyle(fontWeight: FontWeight.bold, color: Colors.red)),
                            Expanded(
                              child: ListView(
                                children: [
                                  for (var q in ['1080p', '720p', '480p', '360p', '240p', '144p'])
                                    RadioListTile(
                                      title: Row(
                                        children: [
                                          Text("$q HD"),
                                          const Spacer(),
                                          if (_downloadedQualities[q] == true)
                                            const Text("✓✓", style: TextStyle(color: Colors.blue, fontWeight: FontWeight.bold)),
                                        ],
                                      ),
                                      value: q,
                                      groupValue: selectedFormat,
                                      onChanged: (val) {
                                        setModalState(() {
                                          selectedFormat = val.toString();
                                          selectedStream = muxedStreams.firstWhere((s) => s.qualityLabel.contains(q), orElse: () => muxedStreams.first);
                                        });
                                      },
                                    ),
                                ],
                              ),
                            ),
                            SizedBox(
                              width: double.infinity,
                              height: 48,
                              child: ElevatedButton(
                                style: ElevatedButton.styleFrom(backgroundColor: const Color(0xFFFF2B42), shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(25))),
                                child: const Text("DOWNLOAD", style: TextStyle(color: Colors.white, fontWeight: FontWeight.bold, fontSize: 16)),
                                onPressed: () {
                                  Navigator.pop(context);
                                  _startDownload(video, selectedStream ?? muxedStreams.first, selectedFormat);
                                },
                              ),
                            ),
                          ],
                        ),
                      );
                    },
                  );
                },
              );
            }

            Future<void> _fetchVideoInfo(String url) async {
              setState(() => _isLoading = true);
              var yt = YoutubeExplode();
              try {
                var video = await yt.videos.get(url);
                var manifest = await yt.videos.streamsClient.getManifest(video.id);
                setState(() => _isLoading = false);
                _showDownloadDialog(video, manifest);
              } catch (_) {
                setState(() => _isLoading = false);
              } finally {
                yt.close();
              }
            }

            Future<void> _startDownload(Video video, dynamic streamInfo, String quality) async {
              ScaffoldMessenger.of(context).showSnackBar(SnackBar(content: Text("$quality Downloading started...")));
              var yt = YoutubeExplode();
              var stream = yt.videos.streamsClient.get(streamInfo);

              Directory dir = Directory('/storage/emulated/0/Download');
              if (!await dir.exists()) dir = (await getExternalStorageDirectory())!;

              var cleanTitle = video.title.replaceAll(RegExp(r'[^\w\s]+'), '');
              var file = File('${dir.path}/$cleanTitle-$quality.mp4');

              var fileStream = file.openWrite();
              await stream.pipe(fileStream);
              await fileStream.flush();
              await fileStream.close();
              yt.close();

              setState(() {
                _downloadedQualities[quality] = true;
              });
              _loadDownloadedFiles();
              ScaffoldMessenger.of(context).showSnackBar(SnackBar(content: Text("✅ Saved $quality (✓✓)!")));
            }

            void _handleFolderDownload(String jsonStr) {
              try {
                var data = jsonDecode(jsonStr);
                String url = data['url'];
                String name = data['name'].replaceAll(RegExp(r'[^\w\s\-]+'), '').trim();

                showDialog(
                  context: context,
                  builder: (ctx) => AlertDialog(
                    title: const Text("📁 Subfolder Download"),
                    content: Text("'$name' என்ற Folder-ல் இதை டவுன்லோட் செய்யவா?"),
                    actions: [
                      TextButton(onPressed: () => Navigator.pop(ctx), child: const Text("Cancel")),
                      ElevatedButton(
                        onPressed: () async {
                          Navigator.pop(ctx);
                          Directory baseDir = Directory('/storage/emulated/0/Download/$name');
                          if (!await baseDir.exists()) await baseDir.create(recursive: true);
                          String fName = url.split('/').last.split('?').first;
                          if (fName.isEmpty) fName = "file.mp4";
                          await Dio().download(url, "${baseDir.path}/$fName");
                          _loadDownloadedFiles();
                          ScaffoldMessenger.of(context).showSnackBar(SnackBar(content: Text("Saved to: Download/$name/$fName")));
                        },
                        child: const Text("Download"),
                      )
                    ],
                  ),
                );
              } catch (_) {}
            }

            void _navigate(String input) {
              String target = input.trim();
              if (!target.startsWith('http://') && !target.startsWith('https://')) {
                target = 'https://m.youtube.com/results?search_query=${Uri.encodeComponent(target)}';
              }
              _webController.loadRequest(Uri.parse(target));
            }

            // 5. Add Page (New Tab) - புதிய பக்கத்தை துவக்குதல்
            void _addNewPage() {
              _searchController.clear();
              _webController.loadRequest(Uri.parse('https://www.google.com'));
              setState(() => _currentTab = 0);
              ScaffoldMessenger.of(context).showSnackBar(const SnackBar(content: Text("New Page Opened! 🌐")));
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(
                  backgroundColor: Colors.white,
                  elevation: 1,
                  title: Container(
                    height: 40,
                    decoration: BoxDecoration(color: Colors.grey[200], borderRadius: BorderRadius.circular(20)),
                    child: TextField(
                      controller: _searchController,
                      decoration: InputDecoration(
                        hintText: "Search or type URL...",
                        prefixIcon: const Icon(Icons.search, size: 20, color: Colors.grey),
                        suffixIcon: IconButton(icon: const Icon(Icons.arrow_forward, size: 18, color: Colors.red), onPressed: () => _navigate(_searchController.text)),
                        border: InputBorder.none,
                        contentPadding: const EdgeInsets.only(top: 8),
                      ),
                      onSubmitted: _navigate,
                    ),
                  ),
                  actions: [
                    // Add Page Button (+)
                    IconButton(
                      icon: const Icon(Icons.add_box_outlined, color: Colors.black87),
                      tooltip: "Add Page / New Tab",
                      onPressed: _addNewPage,
                    ),
                    // Bookmark Star Button (⭐)
                    IconButton(
                      icon: const Icon(Icons.star_border, color: Colors.amber),
                      tooltip: "Bookmark Page",
                      onPressed: _toggleBookmark,
                    ),
                  ],
                ),

                // Selected Screen Body
                body: IndexedStack(
                  index: _currentTab,
                  children: [
                    // TAB 0: HOME / BROWSER
                    Stack(
                      children: [
                        WebViewWidget(controller: _webController),
                        if (_isLoading) const Center(child: CircularProgressIndicator(color: Colors.red)),
                      ],
                    ),

                    // TAB 1: BOOKMARKS PAGE
                    _bookmarks.isEmpty
                        ? const Center(child: Text("இன்னும் எந்த Bookmark-ம் சேர்க்கப்படவில்லை! ⭐"))
                        : ListView.builder(
                            itemCount: _bookmarks.length,
                            itemBuilder: (context, i) {
                              var b = _bookmarks[i];
                              return ListTile(
                                leading: const Icon(Icons.bookmark, color: Colors.amber),
                                title: Text(b['title'] ?? '', maxLines: 1),
                                subtitle: Text(b['url'] ?? '', maxLines: 1),
                                trailing: IconButton(
                                  icon: const Icon(Icons.delete, color: Colors.red),
                                  onPressed: () async {
                                    setState(() => _bookmarks.removeAt(i));
                                    final p = await SharedPreferences.getInstance();
                                    p.setString('saved_bookmarks', jsonEncode(_bookmarks));
                                  },
                                ),
                                onTap: () {
                                  _webController.loadRequest(Uri.parse(b['url']!));
                                  setState(() => _currentTab = 0);
                                },
                              );
                            },
                          ),

                    // TAB 2: DOWNLOADS PAGE
                    _downloadedFiles.isEmpty
                        ? const Center(child: Text("டவுன்லோட் செய்யப்பட்ட ஃபைல்கள் எதுவும் இல்லை! 📥"))
                        : ListView.builder(
                            itemCount: _downloadedFiles.length,
                            itemBuilder: (context, i) {
                              var file = _downloadedFiles[i];
                              String name = file.path.split('/').last;
                              return ListTile(
                                leading: const Icon(Icons.video_file, color: Colors.red),
                                title: Text(name, maxLines: 2, style: const TextStyle(fontSize: 13)),
                                subtitle: Text("${(file.statSync().size / (1024 * 1024)).toStringAsFixed(2)} MB"),
                                trailing: IconButton(
                                  icon: const Icon(Icons.delete, color: Colors.grey),
                                  onPressed: () {
                                    file.deleteSync();
                                    _loadDownloadedFiles();
                                  },
                                ),
                              );
                            },
                          ),

                    // TAB 3: SETTINGS PAGE
                    ListView(
                      padding: const EdgeInsets.all(16),
                      children: [
                        const ListTile(
                          leading: Icon(Icons.folder, color: Colors.blue),
                          title: Text("Download Location"),
                          subtitle: Text("/storage/emulated/0/Download"),
                        ),
                        const Divider(),
                        ListTile(
                          leading: const Icon(Icons.cleaning_services, color: Colors.orange),
                          title: const Text("Clear Browser Cache"),
                          subtitle: const Text("வரலாறு மற்றும் குக்கீகளை அழிக்க"),
                          onTap: () async {
                            await _webController.clearCache();
                            ScaffoldMessenger.of(context).showSnackBar(const SnackBar(content: Text("Browser Cache Cleared! 🧹")));
                          },
                        ),
                        const Divider(),
                        const ListTile(
                          leading: Icon(Icons.info_outline, color: Colors.green),
                          title: Text("Version"),
                          subtitle: Text("VidMate Master Edition v1.2"),
                        ),
                      ],
                    ),
                  ],
                ),

                // Floating Download Button (Browser-ல் மட்டும்)
                floatingActionButton: _currentTab == 0
                    ? FloatingActionButton(
                        backgroundColor: const Color(0xFFFF2B42),
                        onPressed: () async {
                          String? u = await _webController.currentUrl();
                          if (u != null) _fetchVideoInfo(u);
                        },
                        child: const Icon(Icons.download, color: Colors.white, size: 28),
                      )
                    : null,

                // 4-Tab Bottom Navigation Bar
                bottomNavigationBar: BottomNavigationBar(
                  currentIndex: _currentTab,
                  selectedItemColor: Colors.red,
                  unselectedItemColor: Colors.grey,
                  type: BottomNavigationBarType.fixed,
                  onTap: (index) {
                    if (index == 2) _loadDownloadedFiles();
                    setState(() => _currentTab = index);
                  },
                  items: const [
                    BottomNavigationBarItem(icon: Icon(Icons.home), label: "Home"),
                    BottomNavigationBarItem(icon: Icon(Icons.bookmark), label: "Bookmarks"),
                    BottomNavigationBarItem(icon: Icon(Icons.download), label: "Downloads"),
                    BottomNavigationBarItem(icon: Icon(Icons.settings), label: "Settings"),
                  ],
                ),
              );
            }
          }
          EOF

          # Permissions
          sed -i '/<manifest/a \    <uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE"/>\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"/>' android/app/src/main/AndroidManifest.xml
          sed -i 's/<application/<application android:requestLegacyExternalStorage="true"/' android/app/src/main/AndroidManifest.xml

      - name: Build Release APK
        run: |
          cd my_downloader
          flutter build apk --release --build-number=${{ github.run_number }} --build-name=1.0.${{ github.run_number }}

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VidMate-Master-APK
          path: my_downloader/build/app/outputs/flutter-apk/app-release.apk
